# CodeRabbit: reviews automatically when a PR is marked ready for review; drafts are skipped.
# Flow: Sol reviews the branch first, the PR opens as a draft, and it is marked ready once,
# after the gates pass. So each PR gets one CodeRabbit review, not one per push.
reviews:
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
  path_filters:
    - "!crates/*/vendor/**"
