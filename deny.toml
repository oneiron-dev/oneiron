[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error@1.0.4 unmaintained; glib-macros@0.18.5 / gtk3-macros@0.18.2 -> proc-macro-error; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property@0.9.0 unmaintained; unic-ucd-ident@0.9.0 -> unic-char-property; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range@0.9.0 unmaintained; unic-ucd-ident@0.9.0 / unic-char-property@0.9.0 -> unic-char-range; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common@0.9.0 unmaintained; unic-ucd-ident@0.9.0 -> unic-ucd-version@0.9.0 -> unic-common; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident@0.9.0 unmaintained; urlpattern@0.3.0 -> unic-ucd-ident; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version@0.9.0 unmaintained; urlpattern@0.3.0 -> unic-ucd-ident@0.9.0 -> unic-ucd-version; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps@2.1.0 unmaintained; loro-internal@1.16.2 -> im@15.1.0 -> bitmaps (also im -> sized-chunks@0.6.5 -> bitmaps); no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2026-0248", reason = "im@15.1.0 unmaintained; loro-internal@1.16.2 -> im; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks@0.6.5 unmaintained; loro-internal@1.16.2 -> im@15.1.0 -> sized-chunks; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill@1.0.3 unmaintained; postcard@1.1.3 -> heapless@0.7.17 -> atomic-polyfill; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2025-0141", reason = "bincode@1.3.3 unmaintained; heed@0.20.5 -> heed-types@0.20.1 -> bincode; no patched release; ONE-335; review by 2026-11-07" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr@0.3.1 unmaintained (not a vulnerability); oneiron dev-dep yrs@0.25.0 -> smallstr; no patched release, remove when yrs migrates; ONE-1923; review by 2026-11-07" },
    # ONE-1837 GATE-1 amendment A1 (card crypto:gseal): the rsa 0.9 line has no
    # patched release; oneiron-seal's exposure is signing-only.
    { id = "RUSTSEC-2023-0071", reason = "rsa@0.9.10 Marvin oracle; oneiron-seal@0.1.0 / pkix-path@0.3.2 -> rsa; signing-only in oneiron-seal, no decryption path; no patched release; ONE-1837 A1; review by 2026-11-07" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # CDLA-Permissive-2.0: webpki-roots root-store data (rustls ecosystem standard), via reqwest rustls-tls-webpki-roots (ONE-1837 network-fetch)
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Sudachi is Apache-2.0 but not yet published to crates.io;
# pinned to tagged release v0.6.11 via git.
allow-git = ["https://github.com/WorksApplications/sudachi.rs"]
