[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # All three advisories are transitive via loro/heed and require upstream dep
    # bumps before the ignores can be removed. Tracked in ONE-335:
    # https://linear.app/oneiron/issue/ONE-335
    { id = "RUSTSEC-2023-0089", reason = "transitive via loro; see ONE-335" },
    { id = "RUSTSEC-2025-0141", reason = "transitive via loro/heed chain; see ONE-335" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.8.5 aliased mut ref; transitive via loro; see ONE-335" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
