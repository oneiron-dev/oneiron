[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained (informational advisory, no safe upgrade); transitive via glib-macros@0.18.5, gtk3-macros@0.18.2; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9.0 is unmaintained (informational advisory, no safe upgrade); transitive via unic-ucd-ident@0.9.0; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9.0 is unmaintained (informational advisory, no safe upgrade); transitive via unic-char-property@0.9.0, unic-ucd-ident@0.9.0; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9.0 is unmaintained (informational advisory, no safe upgrade); transitive via unic-ucd-version@0.9.0; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9.0 is unmaintained (informational advisory, no safe upgrade); transitive via urlpattern@0.3.0; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9.0 is unmaintained (informational advisory, no safe upgrade); transitive via unic-ucd-ident@0.9.0; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps 2.1.0 is unmaintained (informational advisory, no safe upgrade); transitive via im@15.1.0, sized-chunks@0.6.5; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2026-0248", reason = "im 15.1.0 is unmaintained (informational advisory, no safe upgrade); transitive via loro-internal 1.16.2; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks 0.6.5 is unmaintained (informational advisory, no safe upgrade); transitive via im@15.1.0; accepted maintenance risk, not fixed; ONE-335; review by 2026-10-07" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained (informational advisory, no patched release); transitive via postcard -> heapless -> atomic-polyfill; https://rustsec.org/advisories/RUSTSEC-2023-0089; https://linear.app/oneiron/issue/ONE-335" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x is unmaintained (informational advisory, no patched release); transitive via heed -> heed-types -> bincode; https://rustsec.org/advisories/RUSTSEC-2025-0141; https://linear.app/oneiron/issue/ONE-335" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr unmaintained (all versions, no safe upgrade); transitive DEV-only via yrs 0.25 (oneiron dev-deps, sync test harness); unmaintained != vulnerability; remove when yrs migrates off smallstr; see ONE-1923" },
    # ONE-1837 GATE-1 amendment A1 (card crypto:gseal): the rsa 0.9 line has no
    # patched release; oneiron-seal's exposure is signing-only.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 Marvin oracle; signing-only exposure in oneiron-seal, no decryption path; no patched 0.9 release; ONE-1837 A1" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # CDLA-Permissive-2.0: webpki-roots root-store data (rustls ecosystem standard), via reqwest rustls-tls-webpki-roots (ONE-1837 network-fetch)
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Sudachi (Apache-2.0) comes from the org fork: upstream v0.6.11 plus the Android
# loader branch, pinned by rev. See docs/ops/forked-dependencies.md.
allow-git = ["https://github.com/oneiron-dev/sudachi.rs"]
