[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # All three advisories are transitive via loro/heed and require upstream dep
    # bumps before the ignores can be removed. Tracked in ONE-335:
    # https://linear.app/oneiron/issue/ONE-335
    { id = "RUSTSEC-2023-0089", reason = "transitive via loro; see ONE-335" },
    { id = "RUSTSEC-2025-0141", reason = "transitive via loro/heed chain; see ONE-335" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.8.5 aliased mut ref; transitive via loro; see ONE-335" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr unmaintained (all versions, no safe upgrade); transitive DEV-only via yrs 0.25 (oneiron dev-deps, sync test harness); unmaintained != vulnerability; remove when yrs migrates off smallstr; see ONE-1923" },
    # ONE-1837 GATE-1 amendment A1 (card crypto:gseal): the rsa 0.9 line has no
    # patched release; oneiron-seal's exposure is signing-only.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 Marvin oracle; signing-only exposure in oneiron-seal, no decryption path; no patched 0.9 release; ONE-1837 A1" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # CDLA-Permissive-2.0: webpki-roots root-store data (rustls ecosystem standard), via reqwest rustls-tls-webpki-roots (ONE-1837 network-fetch)
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Sudachi is Apache-2.0 but not yet published to crates.io;
# pinned to tagged release v0.6.11 via git.
allow-git = ["https://github.com/WorksApplications/sudachi.rs"]
