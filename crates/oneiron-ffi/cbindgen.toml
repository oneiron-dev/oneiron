language = "C"
include_guard = "ONEIRON_FFI_H"
pragma_once = true
cpp_compat = true
usize_is_size_t = true
documentation = true
header = """
/*
 * Oneiron C ABI for iOS and macOS on-device vault access.
 *
 * Ownership: variable-size outputs are allocated by Rust and returned through
 * OneironBuffer or typed array structs. Release them with the paired
 * oneiron_*_free function from this header. Do not pass Rust-owned pointers
 * to free(), and do not free the same value twice.
 *
 * Boundary validation: EntityId inputs must be exactly 16 bytes. Text queries
 * are capped at 8 KiB, search limits at 1000, and dimensions at 16384.
 *
 * Intentionally absent: start_sync and stop_sync are not exported while sync
 * remains disabled pre-launch.
 */
"""

[enum]
prefix_with_name = true

[parse]
parse_deps = false

[export]
item_types = ["enums", "structs", "opaque", "functions"]
include = [
  "OneironStatus",
  "OneironByteSlice",
  "OneironEntityInput",
  "OneironBuffer",
  "OneironEdgeInfo",
  "OneironEdgeInfoArray",
  "OneironScoredEntity",
  "OneironScoredEntityArray",
  "OneironSubtreeEntry",
  "OneironSubtreeEntryArray",
  "OneironVault",
  "oneiron_buffer_free",
  "oneiron_edge_info_array_free",
  "oneiron_scored_entity_array_free",
  "oneiron_subtree_entry_array_free",
  "oneiron_vault_open",
  "oneiron_vault_free",
  "oneiron_vault_health_json",
  "oneiron_vault_put_entity",
  "oneiron_vault_batch_put_entities",
  "oneiron_vault_get_entity",
  "oneiron_vault_delete_entity",
  "oneiron_vault_entity_exists",
  "oneiron_vault_put_edge",
  "oneiron_vault_edges_out",
  "oneiron_vault_edges_in",
  "oneiron_vault_search_vector",
  "oneiron_vault_search_text",
  "oneiron_vault_put_vector",
  "oneiron_vault_context_pack",
  "oneiron_vault_get_entity_type",
  "oneiron_vault_entities_by_type",
  "oneiron_vault_targets",
  "oneiron_vault_sources",
  "oneiron_vault_subtree",
  "oneiron_vault_ancestors",
  "oneiron_vault_would_create_cycle",
]
