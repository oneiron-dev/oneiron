[package]
name = "oneiron-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
# No doc-comment code fences in this crate (audited 2026-08-19); skip the
# doctest compile pass entirely.
doctest = false

[dependencies]
oneiron = { path = "../oneiron" }
serde_json = { workspace = true }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
