[package]
name = "oneiron-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib/mod.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
oneiron = { path = "../oneiron" }
serde_json = { workspace = true }
# OF-237 slice 2: `oneiron_engine_*` runs the full server in the app's
# process (`oneiron_server::embedded`), the app's callback table is its host
# (`AppHost`), and the keychain's secrets cross as `Zeroizing` bytes.
oneiron-server = { path = "../oneiron-server" }
oneiron-vault-contract = { path = "../oneiron-vault-contract" }
anyhow = "1"
zeroize = "1"

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
