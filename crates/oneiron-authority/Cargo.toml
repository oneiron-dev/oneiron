[package]
name = "oneiron-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authority vocabulary of the oneiron engine: the authority-log wire layer and federation scope codecs"
repository.workspace = true
homepage.workspace = true

[dependencies]
oneiron-contracts = { version = "0.1.0", path = "../oneiron-contracts" }
oneiron-crypto = { version = "0.1.0", path = "../oneiron-crypto" }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
p256 = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true, features = ["with-serde"] }
schemars = "=0.8.22"
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = "1"

[dev-dependencies]
oneiron-contracts = { version = "0.1.0", path = "../oneiron-contracts", features = ["test-support"] }

[lints]
workspace = true
