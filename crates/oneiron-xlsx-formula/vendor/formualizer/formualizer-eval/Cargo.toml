[package]
edition = "2024"
name = "formualizer-eval"
version = "0.9.3"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-performance Arrow-backed Excel formula engine with dependency graph and incremental recalculation"
homepage = "https://github.com/psu3d0/formualizer"
documentation = "https://docs.rs/formualizer"
readme = "README.md"
keywords = [
    "spreadsheet",
    "excel",
    "evaluation",
    "arrow",
    "dependency-graph",
]
categories = [
    "data-structures",
    "mathematics",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/psu3d0/formualizer"
resolver = "2"

[features]
benchmark_internal = []
default = ["system-clock"]
formula_plane_diagnostics = []
js-runtime = [
    "dep:web-time",
    "dep:getrandom",
    "dep:getrandom02",
    "chrono/wasmbind",
]
perf_instrumentation = []
serde = [
    "dep:serde",
    "formualizer-common/serde",
]
system-clock = ["chrono/clock"]
test-support = []
tracing = [
    "dep:tracing",
    "dep:tracing-subscriber",
]
tracing_chrome = [
    "tracing",
    "dep:tracing-chrome",
]

[lib]
name = "formualizer_eval"
path = "src/lib.rs"

[[example]]
name = "perf_tranche_probe"
path = "examples/perf_tranche_probe.rs"
required-features = ["test-support"]

[[example]]
name = "range_projection_probe"
path = "examples/range_projection_probe.rs"
required-features = ["test-support"]

[[example]]
name = "recalc_invalidation"
path = "examples/recalc_invalidation.rs"
required-features = ["test-support"]

[[example]]
name = "recalc_quadratic"
path = "examples/recalc_quadratic.rs"
required-features = ["test-support"]

[[example]]
name = "recalc_reuse"
path = "examples/recalc_reuse.rs"
required-features = ["test-support"]

[[test]]
name = "api_compat_datetime"
path = "tests/api_compat_datetime.rs"

[[test]]
name = "api_non_exhaustive"
path = "tests/api_non_exhaustive.rs"

[[test]]
name = "fp8_ingest_pipeline_parity"
path = "tests/fp8_ingest_pipeline_parity.rs"
