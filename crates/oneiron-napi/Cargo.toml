[package]
name = "oneiron-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
# No doc-comment code fences in this crate (audited 2026-08-19); skip the
# doctest compile pass entirely.
doctest = false

[dependencies]
oneiron = { path = "../oneiron" }
# ONE-1441 WIRE-P1: the shared SDK backend. This crate reaches an embedded or
# remote vault THROUGH it and never depends on an HTTP client directly.
oneiron-remote = { path = "../oneiron-remote" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
base64 = "0.22"
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
