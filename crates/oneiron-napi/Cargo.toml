[package]
name = "oneiron-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib/mod.rs"
crate-type = ["cdylib"]
# No doc-comment code fences in this crate (audited 2026-08-19); skip the
# doctest compile pass entirely.
doctest = false

[dependencies]
oneiron = { path = "../oneiron" }
# ONE-1441 WIRE-P1: the shared SDK backend. This crate reaches an embedded or
# remote vault THROUGH it and never depends on an HTTP client directly.
oneiron-remote = { path = "../oneiron-remote" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
base64 = "0.22"
serde_json = { workspace = true }

# Linux libtest is not hosted by Node. Use napi-rs's supported dynamic
# symbol loader only for Rust tests; the production addon still resolves
# its Node-API symbols from the real importing host. These Rust tests cover
# conversion/engine logic; JS ABI coverage remains in the Node-host tests.
# (C07: Linux libtest has no Node host. Resolve symbols dynamically only in
# its dev dependency graph; the production addon is unchanged. Rust tests
# exercise conversions/engine calls, not Node-API calls; tests/node_host.cjs
# covers the real Node-host boundary separately.)
[target.'cfg(target_os = "linux")'.dev-dependencies]
napi = { version = "3", default-features = false, features = ["dyn-symbols"] }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
