[package]
name = "oneiron-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
oneiron = { path = "../oneiron" }
# ONE-1441 D2 — the ONE HTTP stack the SDK owns.
#
# Blocking + rustls + JSON, and already resolved in this workspace at these
# exact features by `oneiron-server` (its `Cargo.toml:50`), so the SDK adds no
# new tree and no second TLS backend. `ureq` — the blueprint's illustrative
# sketch — is in neither `Cargo.lock` nor the local registry cache, so choosing
# it would add a fetch and a second TLS stack to buy nothing.
#
# `json` is deliberately NOT enabled: request serialization measures the raw
# request ceiling before send. Synchronous replies decode through the capped
# reader, without a whole raw-body copy. Typed allocations can begin before
# its final size probe, but read failures still precede the decode result.
# A convenience `.json()` would bypass that response-reader boundary.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
futures-channel = "0.3"
futures-core = { workspace = true }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }

tempfile = "3"
zstd = "0.13"

[lints]
workspace = true
