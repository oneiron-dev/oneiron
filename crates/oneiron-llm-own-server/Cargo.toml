[package]
name = "oneiron-llm-own-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lib]
doctest = false
[dependencies]
oneiron = { path = "../oneiron" }
oneiron-remote = { path = "../oneiron-remote" }
# The mesh leg: a model on another of the owner's nodes (OF-575 MESH).
oneiron-mesh-transport = { path = "../oneiron-mesh-transport" }
blake3 = { workspace = true }
futures-core = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_bytes = "0.11"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time"] }
[dev-dependencies]
tempfile = "3"
oneiron = { path = "../oneiron", features = ["test-hooks"] }
serde_json = { workspace = true }
[lints]
workspace = true
