[package]
name = "oneiron-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared value vocabulary below every oneiron engine crate"
repository.workspace = true

[lib]
# No doc-comment code fences in this crate. The ForeignWorldId `compile_fail`
# doctest names `oneiron`'s sync selector, so it lives in `oneiron::entity_id`.
doctest = false

[dependencies]
blake3 = { workspace = true }
# `Error::Storage` carries the LMDB error. Same vendored heed as `oneiron`.
heed = { workspace = true }
# The machine-memory probe behind the memory-derived `[limits]` rows.
libc = "0.2"
# `#[derive(Register)]`, re-exported beside the trait in `register` (Fable pass 25).
oneiron-derive = { version = "0.1.0", path = "../oneiron-derive" }
# The fingerprint door, re-exported as `oneiron_contracts::fingerprint` (PLAN-UC-04).
oneiron-fingerprint = { version = "0.1.0", path = "../oneiron-fingerprint" }
# The one hex policy (lowercase canonical); `bytes_to_hex_lower` re-exports its encoder.
oneiron-hex = { version = "0.1.0", path = "../oneiron-hex" }
rand_core = { workspace = true }
# The Beta posterior seam (`posterior`) samples with these; same versions as `oneiron`.
rand = "0.8"
rand_distr = "0.4"
loro = { workspace = true, optional = true }
# The one reader for untyped MessagePack rows (`msgpack`, PLAN-UC-08) and its typed-row pair.
rmp-serde = { workspace = true }
rmpv = { workspace = true }
schemars = "=0.8.22"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[features]
# The CRDT/window/protocol error variants. `oneiron`'s `sync` feature turns this on.
sync = ["dep:loro"]
# Test-only constructors that `oneiron`'s own tests use (e.g. unchecked EntityId
# bytes). Enabled through `oneiron`'s `test-support` feature; never in production.
test-support = []

[lints]
workspace = true
