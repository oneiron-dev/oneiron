[package]
name = "oneiron-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process tokio supervisor that pumps Dreamer wake passes (the starter motor)"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# No doc-comment code fences in this crate (audited 2026-08-19); skip the
# doctest compile pass entirely.
doctest = false

[dependencies]
oneiron = { version = "0.1.0", path = "../oneiron" }
# Exactly ONE LlmBackend adapter, and it is the LOCAL one on purpose: the
# supervisor's default backend construction must not imply network egress —
# hosts that want a remote adapter inject their own Arc<dyn LlmBackend>.
oneiron-llm-local = { version = "0.1.0", path = "../oneiron-llm-local" }
# Mirrors the oneiron core feature set (rt/sync/time/macros), NOT tokio
# "full": the driver is a plain event consumer, no net/io stack of its own.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = { version = "0.1" }

[dev-dependencies]
# Turns on the engine's `test-support` seam for THIS crate's tests only (same
# self-dev-dependency pattern `oneiron` uses on itself). CMT-2's deadline
# source must be provable to answer `Err` — never a quiet `Ok(None)` — on a
# corrupt commitment due index, and `corrupt_commitment_due_row_for_test` is
# the only door that plants such a row. No package is added: `oneiron` is
# already a dependency, so the lockfile is untouched.
oneiron = { version = "0.1.0", path = "../oneiron", features = ["test-support"] }
# Tests hand-encode turn bodies and legacy job payloads (rmpv-valued).
rmpv = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "test-util"] }

[lints]
workspace = true
