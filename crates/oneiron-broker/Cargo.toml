[package]
name = "oneiron-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Credential broker: sends one admitted model request with a key the daemon hands it, and strips that key from the reply"
repository.workspace = true
homepage.workspace = true

[lib]
doctest = false

[features]
# The local TLS fake provider that the broker's own tests and the server's
# paid-leg fixture run against. Never in a shipped build.
test-support = ["dep:rcgen", "dep:tokio-rustls"]

# No `oneiron` edge: the broker runs no model and no generated code
# (ARCH-0069 #broker-design). Its binary lives in `oneiron-server`, so the two
# ship side by side, and calls only this library.
[dependencies]
base64 = "0.22"
blake3 = { workspace = true }
# OF-603: gzip request bodies to the one route that takes them.
flate2 = "1"
memchr = "2"
# rustls only, and both root stores. `retry(never())` and `Policy::none()` are
# set on the client itself, so no feature another crate turns on can make it
# resend.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1"
rcgen = { version = "0.14", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The same-user child starts with its channel and stdio only.
oneiron-spawn = { version = "0.1.0", path = "../oneiron-spawn" }
# The same-user child's channel: each call's socket passes to it as a
# descriptor (SCM_RIGHTS), and the daemon polls it for the child's hang-up.
rustix = { version = "1", features = ["event", "net", "std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
