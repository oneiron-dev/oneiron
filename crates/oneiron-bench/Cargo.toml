[package]
name = "oneiron-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
oneiron = { path = "../oneiron" }
blake3.workspace = true
rand = "0.8"
rmp-serde.workspace = true
# ONE-1579: the perf harness builds `ClaimCandidate` / `WriteProvenance`
# payloads through the engine's public write-envelope constructors, which take
# `rmpv::Value` directly.
rmpv.workspace = true
serde.workspace = true
serde_json.workspace = true
# ONE-1961: the run certificate's blake3 digests are taken over RFC 8785
# canonical JSON so `oneiron-eval perf-verify` can recompute them with
# `rfc8785`. See `src/perf/certificate.rs`.
serde_json_canonicalizer.workspace = true
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true

[lints]
workspace = true
