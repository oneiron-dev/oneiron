[package]
name = "oneiron-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Base layer of the oneiron engine: the error and id vocabulary, retrieval kernels, the context-pack tokenizer and the panic report"
repository.workspace = true

[lib]
# No doc-comment code fences in this crate.
doctest = false

[features]
# Forwarded by `oneiron/sync`: compiles the sync error vocabulary in `error`.
sync = ["oneiron-contracts/sync"]

[dependencies]
oneiron-contracts = { version = "0.1.0", path = "../oneiron-contracts" }
oneiron-model = { version = "0.1.0", path = "../oneiron-model" }
oneiron-retrieval = { version = "0.1.0", path = "../oneiron-retrieval" }
tiktoken-rs = "0.12.0"
tracing = { version = "0.1" }

[lints]
workspace = true
