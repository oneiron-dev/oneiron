[package]
name = "oneiron-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Image, video and music job wire adapters for the Oneiron media and image seams, one module per wire protocol"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# No doc-comment code fences in these modules (gemini, comfyui, openrouter);
# skip the doctest compile pass entirely.
doctest = false

# ARCH-0036 #adapters (MED-1 = A): each wire protocol is a module of this one
# family crate. Features switch optional dependencies only, off by default, so
# a default build carries no network client of its own.
[features]
default = []
# The self-hosted ComfyUI adapter's own HTTP client (`comfyui`).
comfyui = ["dep:reqwest", "dep:tokio"]

[dependencies]
oneiron = { version = "0.1.0", path = "../oneiron" }
# The Gemini media leg classifies a refused reply as the Gemini text leg does.
oneiron-llm = { version = "0.1.0", path = "../oneiron-llm" }
base64 = "0.22"
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[lints]
workspace = true
