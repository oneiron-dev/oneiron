[package]
edition = "2021"
name = "heed"
version = "0.20.5"
authors = ["Kerollmops <renault.cle@gmail.com>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A fully typed LMDB wrapper with minimum overhead"
readme = "README.md"
# Keep upstream archive metadata in the checkout for provenance, but not as
# inputs to a new package. Cargo owns these generated names; the VCS file
# otherwise makes `cargo package --list` (used by maturin sdist) fail.
exclude = ["/.cargo_vcs_info.json", "/Cargo.toml.orig"]
keywords = [
    "lmdb",
    "database",
    "storage",
    "typed",
]
categories = [
    "database",
    "data-structures",
]
license = "MIT"
repository = "https://github.com/Kerollmops/heed"

[lib]
name = "heed"
path = "src/lib.rs"

[[example]]
name = "all-types"
path = "examples/all-types.rs"

[[example]]
name = "clear-database"
path = "examples/clear-database.rs"

[[example]]
name = "cursor-append"
path = "examples/cursor-append.rs"

[[example]]
name = "custom-comparator"
path = "examples/custom-comparator.rs"

[[example]]
name = "multi-env"
path = "examples/multi-env.rs"

[[example]]
name = "nested"
path = "examples/nested.rs"

[[example]]
name = "rmp-serde"
path = "examples/rmp-serde.rs"
required-features = ["serde-rmp"]

[dependencies.bitflags]
version = "2.6.0"
features = ["serde"]

[dependencies.byteorder]
version = "1.5.0"
default-features = false

[dependencies.heed-traits]
version = "0.20.0"

[dependencies.heed-types]
version = "0.20.1"
default-features = false

[dependencies.libc]
version = "0.2.155"

[dependencies.lmdb-master3-sys]
version = "0.2.6"

[dependencies.chacha20poly1305]
version = "0.11.0"
default-features = false

[dependencies.getrandom]
version = "0.4.3"

[dependencies.zeroize]
version = "1.9.0"

[dependencies.once_cell]
version = "1.19.0"

[dependencies.page_size]
version = "0.6.0"

[dependencies.serde]
version = "1.0.203"
features = ["derive"]
optional = true

[dependencies.synchronoise]
version = "1.0.1"

[dev-dependencies.serde]
version = "1.0.203"
features = ["derive"]

[dev-dependencies.tempfile]
version = "3.10.1"

[features]
arbitrary_precision = ["heed-types/arbitrary_precision"]
default = [
    "serde",
    "serde-bincode",
    "serde-json",
]
longer-keys = ["lmdb-master3-sys/longer-keys"]
mdb_idl_logn_10 = ["lmdb-master3-sys/mdb_idl_logn_10"]
mdb_idl_logn_11 = ["lmdb-master3-sys/mdb_idl_logn_11"]
mdb_idl_logn_12 = ["lmdb-master3-sys/mdb_idl_logn_12"]
mdb_idl_logn_13 = ["lmdb-master3-sys/mdb_idl_logn_13"]
mdb_idl_logn_14 = ["lmdb-master3-sys/mdb_idl_logn_14"]
mdb_idl_logn_15 = ["lmdb-master3-sys/mdb_idl_logn_15"]
mdb_idl_logn_16 = ["lmdb-master3-sys/mdb_idl_logn_16"]
mdb_idl_logn_8 = ["lmdb-master3-sys/mdb_idl_logn_8"]
mdb_idl_logn_9 = ["lmdb-master3-sys/mdb_idl_logn_9"]
posix-sem = ["lmdb-master3-sys/posix-sem"]
preserve_order = ["heed-types/preserve_order"]
raw_value = ["heed-types/raw_value"]
read-txn-no-tls = []
serde = [
    "bitflags/serde",
    "dep:serde",
]
serde-bincode = ["heed-types/serde-bincode"]
serde-json = ["heed-types/serde-json"]
serde-rmp = ["heed-types/serde-rmp"]
unbounded_depth = ["heed-types/unbounded_depth"]

[target."cfg(windows)".dependencies.url]
version = "2.5.2"
