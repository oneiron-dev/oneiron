[package]
name = "oneiron-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local Oneiron sync daemon for serving a single LMDB vault"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
oneiron = { version = "0.1.0", path = "../oneiron", features = ["sync"] }
loro = "1.10"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
zstd = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
rmp-serde = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1"
serde_bytes = "0.11"
subtle = "2"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Lease-registrar tests sign proof-of-possession transcripts themselves
# (contract-grounded, ONE-1140). `test-hooks` compiles in the lease
# mirror-failure injection seam used by the root-snapshot/`ls:`-mirror
# atomicity test (ONE-1140); no production effect.
ed25519-dalek = { workspace = true }
oneiron = { version = "0.1.0", path = "../oneiron", features = ["sync", "test-hooks"] }

[lints]
workspace = true
