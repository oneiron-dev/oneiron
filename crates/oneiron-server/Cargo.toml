[package]
name = "oneiron-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local Oneiron sync daemon for serving a single LMDB vault"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "oneiron-server"
path = "src/main.rs"

[[bin]]
name = "oneiron"
path = "src/bin/oneiron.rs"
doc = false

[lib]
# No doc-comment code fences in this crate (audited 2026-08-19); skip the
# doctest compile pass entirely.
doctest = false

[dependencies]
oneiron = { version = "0.1.0", path = "../oneiron", features = ["sync"] }
# Supervisor ⇄ vault child-process contract, consumed READ-ONLY: managed serve
# mode speaks exactly the wire types, framing and limits this crate freezes, so
# a framing bug cannot diverge between supervisor and engine. No wire reshape
# and no CONTRACT_VERSION bump belongs on this side of the seam.
oneiron-vault-contract = { version = "0.1.0", path = "../oneiron-vault-contract" }
loro = "1.10"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
zstd = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
rmp-serde = { workspace = true }
rmpv = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1"
serde_bytes = "0.11"
blake3 = { workspace = true }
subtle = "2"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = { workspace = true }
utoipa = "5.5.0"
# EMB-7/EMB-8 local embedder (ONE-1979/ONE-1980). Pinned exact: the quantise
# path calls `candle_core::quantized::QTensor::quantize` and the Metal SDPA
# branch calls `candle_nn::ops::sdpa`, both 0.11.0 public API, and a minor bump
# has moved either before. crates.io only — never a git candle and never a
# `mistralrs-*` crate (BLUEPRINT-EMB-5-v3 §Fork policy).
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
# The pre-tokenizer's regex engine named explicitly, and nothing else: no
# progress bars in a daemon. `onig` rather than the pure-Rust alternative
# because `candle-core` depends on `tokenizers` with its own defaults, so the C
# engine is in this tree whichever we ask for, and it is the engine the
# reference runtime tokenized with — the parity row would find any difference.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# Model-artifact download rides the `reqwest` blocking client already in this
# file. `hf-hub` 1.0 was the blueprint's choice, but its sync handle drives an
# owned tokio runtime through `block_on`, which the embedding worker cannot call
# from inside the server's runtime, and it pulls the whole Xet CAS client for a
# job that is six pinned GETs against `/resolve/<sha>/`.
sha2 = "0.10"
# Already in the tree through the engine's f16 vector rows; named explicitly
# because the numerics guard rounds every component through `f16` itself.
half = "2"

# Metal is the default embedder device on Apple silicon, expressed as a
# target-gated feature activation rather than a cargo feature: a cargo feature
# would be switched on by `--all-features` on every host, including the Linux
# reference runner where the Metal kernels do not build.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "=0.11.0", features = ["metal"] }
candle-nn = { version = "=0.11.0", features = ["metal"] }

[dev-dependencies]
# Parse memory-reason YAML in quoted-scalar control-character regressions.
serde_yaml_ng = "0.10"
tempfile = "3"
# `util` carries `ServiceExt::oneshot`, which the router-level rows in
# `src/api/tests.rs` and `src/commands/tests.rs` drive requests through. The
# feature reached us only because axum enables it on its own `tower` edge —
# an implicit that an axum bump could drop out from under the test suite.
tower = { version = "0.5", features = ["util"] }
# `start_paused` for the drain's tick row: that row must not poll the send
# itself (a re-poll is a free re-consult a park-only drain would ride to a
# pass), so it waits out the guard's own interval instead. Virtual time makes
# that wait cost no wall clock and no flakiness. Test-only: dev-dependency
# features are not unified into the normal build.
tokio = { version = "1", features = ["full", "test-util"] }
# The WebSocket codec PRODUCTION runs, under a name that says so.
#
# The real-codec revocation rows in `src/handler/tests.rs` assert byte
# properties of `start_send` — when the codec writes through, what an owed pong
# leaves in the out-buffer — so they are only evidence about this server if
# they drive the codec this server actually builds. `axum` (above, feature
# `ws`) is what builds it, and axum 0.8 resolves tokio-tungstenite 0.29; the
# unaliased `tokio-tungstenite` in `[dependencies]` is a DIFFERENT, older
# version reached through the `oneiron` crate, and a test bound to that one
# would prove nothing about production while staying green.
#
# Aliased rather than plain because both versions are in this graph and
# `tokio_tungstenite` would otherwise be ambiguous at the use site. Keep the
# version in step with axum's resolution — `the_real_codec_rows_run_the_same
# _codec_version_axum_resolves` reads Cargo.lock and fails if it drifts.
production-ws-codec = { package = "tokio-tungstenite", version = "0.29" }
# Lease-registrar tests sign proof-of-possession transcripts themselves
# (contract-grounded, ONE-1140). `test-hooks` compiles in the lease
# mirror-failure injection seam used by the root-snapshot/`ls:`-mirror
# atomicity test (ONE-1140); no production effect.
ed25519-dalek = { workspace = true }
oneiron = { version = "0.1.0", path = "../oneiron", features = ["sync", "test-hooks"] }

[lints]
workspace = true
