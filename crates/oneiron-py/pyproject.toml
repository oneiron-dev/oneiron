[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "oneiron"
description = "Memory for agents: witness a turn, claim a fact, recall it, read the receipts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["memory", "agents", "retrieval", "vector-search", "knowledge-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# ONE-1441 I12: the version is NOT duplicated here. maturin reads it from
# `Cargo.toml`, whose major `build.rs` asserts against MEMORY_PACK_VERSION, so
# there is one place the number lives and one place it is checked.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/oneiron-dev/oneiron"
Repository = "https://github.com/oneiron-dev/oneiron"

[tool.maturin]
# The extension is PRIVATE: `oneiron._native`. The public import stays
# `from oneiron import Oneiron`, and the wrapper never re-exports the native
# class.
module-name = "oneiron._native"
python-source = "python"
features = ["pyo3/extension-module"]
# Publish allowlist: the wrapper, its stubs, and the compiled extension. No
# Rust sources, no tests, no vaults, no credentials.
include = [
  { path = "python/oneiron/py.typed", format = ["sdist", "wheel"] },
  { path = "python/oneiron/__init__.pyi", format = ["sdist", "wheel"] },
]
exclude = [
  "tests/**",
  "target/**",
  "**/*.rs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
