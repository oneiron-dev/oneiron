[package]
name = "oneiron-keystore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "This-device-only key slots: the platform keystore behind one small trait"
repository.workspace = true
publish = false

[lib]
doctest = false

# Few dependencies on purpose: the Apple adapters must check for an Apple target
# from Linux (scripts/ci/check_keystore_apple_target.sh; no CI job runs it yet),
# so nothing here may need a C toolchain or an SDK at build time.
[dependencies]
thiserror = { workspace = true }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = "2.17"

# The macOS unlock sheet (LocalAuthentication), through the bindings the
# workspace already locks for the macOS app; no SDK at build time.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "block2"] }

# DPAPI, the session's lock record and the window the unlock prompt shows over,
# through the binding the workspace already locks. Windows Hello's prompt is a
# Windows Runtime call, which windows-sys does not carry: it comes from the
# `windows` crate, with its asynchronous-call types from `windows-future`, both
# already in the workspace lock. No SDK at build time
# (scripts/ci/check_keystore_windows_target.sh; no CI job runs it yet).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_System_WinRT"] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

[features]
# The process-memory adapter (slots, sealed bytes and a counted auth-bound
# secret), the scripted presence prompt and device PIN, the manual presence
# clocks, and the TPM tier on a socket, for this crate's tests and its
# dependents' tests.
test-keystore = []

[dev-dependencies]
tempfile = "3"

# The presence layer's tests drive the scripted prompt and the manual clocks.
[[test]]
name = "user_presence"
required-features = ["test-keystore"]

# The sealed-bytes home's tests compare the file tier with the memory tier.
[[test]]
name = "sealed_bytes"
required-features = ["test-keystore"]

# The TPM tier's device PIN key, against a scripted chip on a socket and the
# memory tier's counter; a software TPM and this machine's chip when asked.
[[test]]
name = "linux_tpm_auth_bound"
required-features = ["test-keystore"]

[lints]
workspace = true
