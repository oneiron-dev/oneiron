[package]
name = "oneiron-keystore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "This-device-only key slots: the platform keystore behind one small trait"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
doctest = false

# Few dependencies on purpose: the Apple adapter is compile-checked for an Apple
# target from Linux, so nothing here may need a C toolchain or an SDK at build time.
[dependencies]
thiserror = { workspace = true }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = "2.17"

# DPAPI, through the binding the workspace already locks; no SDK at build time.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
# The process-memory adapter, for this crate's tests and its dependents' tests.
test-keystore = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
