[package]
name = "oneiron-container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Container guest sessions for hosts without KVM: one long-lived guest, stdio only"
publish = false

[lib]
doctest = false

[dependencies]
blake3 = { workspace = true }
oneiron-spawn = { path = "../oneiron-spawn" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "oneiron-fence"
path = "src/bin/oneiron-fence.rs"
test = false
bench = false

[[bin]]
name = "oneiron-browser-relay"
path = "src/bin/oneiron-browser-relay.rs"
test = false
bench = false

[lints]
workspace = true
