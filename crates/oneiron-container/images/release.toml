version = "0.18.0-ts7.1.0-dev.20260929"
upstream_commit = "5f92808bc92bb97b06212153ab73d28d551c0b9b"
url = "https://registry.npmjs.org/@tsrs/linux-x64-gnu/-/linux-x64-gnu-0.18.0-ts7.1.0-dev.20260929.tgz"
integrity = "sha512-EdBwBgNICGu1r1h23ixdcKwsMo6E9ll7ZsY3mNERNYqE1Pwdtcat99d5E7zB1J+oy/Xk6YqiizaB6nolIjpDTw=="

[inputs.kernel]
# The kernel stays a separate artifact: no rootfs here holds one. No kernel
# source release is pinned in the repo (the builders take an operator-supplied
# archive); these are the existing config fragments.
vault_config = "kernel-config-vault"
foreign_config = "kernel-config-foreign"

[inputs.build]
# SOURCE_DATE_EPOCH = the snapshot instant (inputs.debian.snapshot).
source_date_epoch = 1791158400
# uuid5(NAMESPACE_URL, "https://github.com/oneiron-dev/oneiron/crates/oneiron-container/images");
# each rootfs UUID and ext4 hash seed is uuid5(seed, "<variant>/x86_64").
seed = "555c8527-4949-5907-a2d5-2fbf63c244e2"

[limits]
# The engine's foreign/native Firecracker verifier: the rootfs file length,
# sparse capacity included (crates/oneiron/src/code_sandbox/firecracker/config.rs:22-26,
# inline, no named constant). The builder refuses a rootfs above it; it does not move it.
firecracker_rootfs_max_bytes = 4294967296
firecracker_kernel_max_bytes = 67108864

# -- variants -------------------------------------------------------------------
# outputs."linux/amd64".state: unbuilt | built-candidate | boot-proved | released.
# phase is the OS-IMAGE roadmap's (1 the browser and checker, 3 the desktop and
# generic agent, 4 the vault): descriptive only, never a build gate or order.

[variants.base]
role = "common base + guest plumbing (oneiron-guest, oneiron-fence, the guest account); the code/minimal guest"
trust_domain = "foreign-code"
recipe = "packages.toml [base]"
replaces_recipe = "code-dockerfile"

[variants.base.budget]
status = "proposed"
payload_max_bytes = 268435456
payload_note = "kernel reported separately"
cold_boot = "guest hello <= 1 s"
ram = "measure agent/VMM overhead separately"

