foreign_config = "kernel-config-foreign"

[inputs.build]
# SOURCE_DATE_EPOCH = the snapshot instant (inputs.debian.snapshot).
source_date_epoch = 1791158400
# uuid5(NAMESPACE_URL, "https://github.com/oneiron-dev/oneiron/crates/oneiron-container/images");
# each rootfs UUID and ext4 hash seed is uuid5(seed, "<variant>/x86_64").
seed = "555c8527-4949-5907-a2d5-2fbf63c244e2"

[limits]
# The engine's foreign/native Firecracker verifier: the rootfs file length,
# sparse capacity included (crates/oneiron/src/code_sandbox/firecracker/config.rs:22-26,
# inline, no named constant). The builder refuses a rootfs above it; it does not move it.
