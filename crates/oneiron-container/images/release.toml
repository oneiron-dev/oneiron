channel_manifest_sha256 = "87eb76c53073e72b766083bed5530820694253b832a762d8385bda5759f03975"
channel_date = "2026-06-30"
# The builder uses the minimal profile's Linux components; the checker's
# runtime toolchain adds rustfmt and clippy (the toolchain file's components).
