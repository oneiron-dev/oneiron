# The Oneiron guest image family: the ONE release list (OS-IMAGE = A).
#
# [inputs] are frozen: every byte a build reads is named here by digest, by
# commit, or by path + sha256 at inputs.engine.commit. [variants.*.outputs]
# are built: a field stays absent until a build measured it, never a zero or
# a placeholder hash. Budgets are proposed engineering targets, not checks.
# packages.toml holds the requested packages and overlays; packages.lock.toml
# the resolved closure. `build.py validate` checks the three agree.
#
# A pin here is identity, not approval: no signature exists yet (a later
# pack signs), and a built-candidate is not a boot proof.
schema = 1

[family]
name = "oneiron-guest"
state = "unreleased"
signature = "none yet: signing is a later pack; no key exists"

[arch."linux/amd64"]
mkosi_architecture = "x86-64"
debian_architecture = "amd64"
rust_target = "x86_64-unknown-linux-gnu"
# building -> built-candidate -> boot-proved -> qualified. aarch64 would be its own release.
qualification = "building"

# -- frozen inputs --------------------------------------------------------------

[inputs.base]
# The base every existing guest Dockerfile names; here it is the bootstrap
# tree the tools tree is built from (its amd64 rootfs layer, fetched over
# the registry API and checked), never the identity of the finished builder.
image = "docker.io/library/debian"
suite_tag = "trixie-slim"
index_digest = "sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f"
platform = "linux/amd64"
manifest_digest = "sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483"
config_digest = "sha256:567e3c17b188e21cd42aa5e1c55e16d8270f880ed8ea321dbd40f993467efc4c"
layer_digest = "sha256:ecc510c1e359bdc007b39802570bb7e4dec7d6ebccf357c3201a74299113e05e"
layer_bytes = 29843350
layer_diff_id = "sha256:15f1c8eb1ab18eae260c7fb6296434cbe1ff0e1e30fd814ae92a80dd54005e62"
created = "2026-10-05T00:00:00Z"
artifacts_commit = "a3751996111ce2c1c904050c84440184535e23b1"
debuerreotype_epoch = 1791158400
registry = "https://registry-1.docker.io"
repository = "library/debian"
token_url = "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/debian:pull"

[inputs.debian]
suite = "trixie"
# Derived, not chosen: the base's debuerreotype epoch 1791158400
# (docker-debian-artifacts at inputs.base.artifacts_commit,
# trixie/slim/rootfs.debuerreotype-epoch; the layer config's history says
# `debian.sh --arch 'amd64' out/ 'trixie' '@1791158400'`) is
# 2026-10-05T00:00:00Z, so packages come from the same instant as the base.
snapshot = "20261005T000000Z"
keyring = "/usr/share/keyrings/debian-archive-keyring.gpg"
# apt verifies each source's InRelease signature with the keyring above;
# plain http is the transport, the signature is the integrity.
signature_check = true
# Only these snapshot sources skip Valid-Until: a frozen Release's date has passed.
check_valid_until = false
lock = "packages.lock.toml"

[[inputs.debian.sources]]
name = "main"
uri = "http://snapshot.debian.org/archive/debian/20261005T000000Z"
suite = "trixie"
components = ["main"]

[[inputs.debian.sources]]
name = "updates"
uri = "http://snapshot.debian.org/archive/debian/20261005T000000Z"
suite = "trixie-updates"
components = ["main"]

[[inputs.debian.sources]]
name = "security"
uri = "http://snapshot.debian.org/archive/debian-security/20261005T000000Z"
suite = "trixie-security"
components = ["main"]

[inputs.mkosi]
version = "27.1"
tag = "v27.1"
commit = "ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b"
archive_url = "https://codeload.github.com/systemd/mkosi/tar.gz/ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b"
archive_sha256 = "3d38e848f9b1108ec76d873f2c378dfc7d4b536ad89deffe8c97504f7a8dff43"

[inputs.rust]
# rust-toolchain.toml says channel "1.96", profile minimal (+ rustfmt, clippy).
# The channel manifest resolves that alias to one exact release:
toolchain_file = "rust-toolchain.toml"
toolchain_file_sha256 = "3435b160321202a0f3ed5eb2e77ac3a39b8a47a68e69c937744f753e1b347592"
channel = "1.96"
version = "1.96.1"
rustc_version = "rustc 1.96.1 (31fca3adb 2026-06-26)"
cargo_version = "cargo 1.96.1 (356927216 2026-06-26)"
channel_manifest_url = "https://static.rust-lang.org/dist/channel-rust-1.96.toml"
channel_manifest_sha256 = "87eb76c53073e72b766083bed5530820694253b832a762d8385bda5759f03975"
channel_date = "2026-06-30"
# The builder uses the minimal profile's Linux components; the checker's
# runtime toolchain adds rustfmt and clippy (the toolchain file's components).
builder_components = ["rustc", "cargo", "rust-std"]

[inputs.rust.components.rustc]
