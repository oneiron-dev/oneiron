[inputs.payloads.tsrs]
kind = "npm"
package = "tsrs"
version = "0.18.0-ts7.1.0-dev.20260929"
upstream_commit = "5f92808bc92bb97b06212153ab73d28d551c0b9b"
url = "https://registry.npmjs.org/tsrs/-/tsrs-0.18.0-ts7.1.0-dev.20260929.tgz"
integrity = "sha512-9T0b4Uam/yMFIK16GUx0fUrJqYZnJ/gvSmV9JB8NTyDePvwCI45WFWxyEV/UMV3KfdNRJG/PBsm3fSIB9WmWsA=="

[inputs.payloads.tsrs-linux-x64-gnu]
