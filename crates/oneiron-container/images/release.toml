# Contract revisions exactly as the engine commit defines them. Where no
# version constant exists the entry says so and the source file above, plus
# the built binary's hash in the receipt, is the identity.
[inputs.contracts.code_guest_protocol]
version = 1
defined_at = "crates/oneiron-guest/src/protocol.rs:104-116 (inline Hello { version: 1 })"
note = "no GUEST_PROTOCOL_VERSION constant"
source = "guest-protocol-src"

[inputs.contracts.wit]
world = "oneiron:code-run/guest@1.0.0"
source = "wit-code-run"

[inputs.contracts.native_session]
note = "no version constant: the Start JSON carries no version field"
source = "guest-native-src"

[inputs.contracts.checker_helper]
header_version = 1
defined_at = "crates/oneiron-container/guest/checker/checker.py:213"
source = "checker-helper"

[inputs.contracts.fence]
landlock_abi_floor = 3
defined_at = "crates/oneiron-container/src/supervisor.rs:684"
note = "no release version constant: the generation is a per-session UUIDv7"
sources = ["fence-wire-src", "fence-supervisor-src"]

[inputs.contracts.relay]
note = "no relay wire version constant"
source = "relay-protocol-src"

[inputs.contracts.vault]
contract_version = 3
vm_provision_revision = 1
vm_outbox_wire_revision = 4
vm_restore_wire_revision = 1
vm_anchor_wire_revision = 1
vm_anchor_proxy_revision = 1
vm_network_revision = 1
vm_managed_profile_revision = 1
# The trusted organ builds capability (FIX 7889, FIX 9344): the revision the
# pinned vault-init carries when it hands each line of the config drive's
# trusted-organ-builds to the engine. A fact, never a gate: the emitter names
# it only when rootfs.tar holds that init, and 0 for an image without it.
vm_trusted_organ_builds_revision = 1
# vm_guest_runtime_revision (FIX 7671, FIX 9344) is not pinned here: the
# emitter measures it from rootfs.tar, 1 only when the image holds the whole
# guest runtime and its descriptor, else 0. This recipe stages none, so its
# images name 0. A fact, never a gate.
defined_in = "crates/oneiron-vault-contract/src/lib/{version,vm_provision,vm_outbox,vm_restore,vm_anchor,vm}.rs"

[inputs.contracts.storage]
abi_version = 23
schema_version = 1
defined_at = "crates/oneiron/src/store/open_gates/open_version_keys.rs:125-131"

# Payloads from outside Debian and the engine.
[inputs.payloads.lightpanda]
kind = "file"
version = "1.0.0"
source_commit = "588f6223b9cae8a2406aeef035ed9363a3e404fd"
url = "https://github.com/lightpanda-io/browser/releases/download/1.0.0/lightpanda-x86_64-linux"
sha256 = "aa5a4b8ed53d1e38b3c73f5b2647d0a84a82e6744557f45f9a9c85858aa031c3"
pinned_in = "browser-dockerfile"

[inputs.payloads.cua-driver]
# FIX 8975: compiled from source in the image's build overlay, offline; no
# published binary is used. The fetch takes GitHub's tarball of the commit
# and keeps only `extract` (upstream's own Nix fileset for the driver: the
# driver workspace reaches the libs/cua telemetry crate, its workspace
# manifest and two JSON files it embeds), plus the licence texts. Its own
# Cargo.lock fills a Cargo store of its own (never the checker's), with the
# toolchain the source pins (rust-toolchain.toml says 1.97.1). The receipt
# and SBOM carry the built binary's hash and its crate closure.
kind = "source-build"
release = "0.36.0"
repository = "https://github.com/trycua/cua"
rev = "6d6c734c127025fb39ad5d585a10382808b39dc1"
archive_url = "https://codeload.github.com/trycua/cua/tar.gz/6d6c734c127025fb39ad5d585a10382808b39dc1"
archive_sha256 = "157acdc2fd0bf5c480af2bdbe4a69f75a709551627f851caee16346234fdedef"
extract = [
  "LICENSE.md",
  "LICENSING.md",
  "libs/cua-driver/rust",
  "libs/cua-driver/wayland-helper",
  "libs/cua/Cargo.toml",
  "libs/cua/crates/cua-telemetry",
  "libs/cua/crates/cua-teleport/src/ux/targets.json",
  "libs/images/sandbox-images.json",
]
workdir = "libs/cua-driver/rust"
cargo_lock_sha256 = "f9d49ce2dccdc43b2f7f027185301138fdd45eab4f9a556aace4cb0f4a98d46c"
package = "cua-driver"
bin = "cua-driver"
# Default features, as the Docker recipe builds it (upstream's own Linux
# release adds portal-input). The two SHAs are what build.rs would ask git
# for; the build has no git and no .git.
build_env = [
  "CUA_DRIVER_GIT_SHA=6d6c734c127025fb39ad5d585a10382808b39dc1",
  "CUA_DRIVER_SOURCE_SHA=6d6c734c127025fb39ad5d585a10382808b39dc1",
]
licence_files = [
  "LICENSE.md",
  "libs/cua-driver/rust/THIRD_PARTY_NOTICES.md",
  "libs/cua-driver/rust/crates/cua-cursor-motion/LICENSE",
  "libs/cua-driver/rust/crates/cursor-overlay/assets/Inter-OFL.txt",
]
licence_dest = "/usr/share/doc/cua-driver"
pinned_in = "desktop-build-sh"

[inputs.payloads.cua-driver.rust]
toolchain_file = "libs/cua-driver/rust/rust-toolchain.toml"
toolchain_file_sha256 = "54b8e00ea6c530bbecda9bfa386552297a06b91ef09a3abcc500850cf29063e7"
version = "1.97.1"
rustc_version = "rustc 1.97.1 (8bab26f4f 2026-07-14)"
cargo_version = "cargo 1.97.1 (c980f4866 2026-06-30)"
