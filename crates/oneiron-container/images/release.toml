[inputs.engine]
# The engine source every native binary is built from: a git archive of this
# commit, not the builder's own checkout. A new release moves it, and every
# pin below that names a repo file (inputs.files, the contract lines, the
# Cargo.lock hash) is recomputed at that same commit, never mixed.
repository = "https://github.com/oneiron-dev/oneiron"
commit = "88741de13777297e8b3c7ca348b356deb302e5db"
workspace_version = "0.1.0"
msrv = "1.96"
cargo_lock_sha256 = "234077d8170fbd7ceba358c475b146b004ec591241ed0875d6239b8f0fa101a3"
# `cargo fetch --locked --target` fills the mirror's CARGO_HOME: the index for
# the whole lock, crate files for this target.
cargo_fetch_target = "x86_64-unknown-linux-gnu"

[inputs.engine.git_dependencies]
formualizer = { url = "https://github.com/oneiron-dev/formualizer", rev = "7ada5f2f32781012ac2bd8a4be9c9ff0aed76fa5" }
iroh = { url = "https://github.com/oneiron-dev/iroh", rev = "17c0612f80f78f5288e97b818b1360ae6ea0a51a" }
