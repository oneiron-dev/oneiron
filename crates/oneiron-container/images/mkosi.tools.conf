# Fixed defaults for the tools tree: the userspace mkosi runs (apt, dpkg,
# the archive keyring, e2fsprogs, ...) while it builds every image. build.py
# builds it from the pinned Debian base's rootfs (ToolsTree= that bootstrap
# tree) against the same frozen snapshot, then builds each image with
# ToolsTree= the finished tree. Its content hash is the builder identity.
# The package list is packages.toml [tools].

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
ManifestFormat=json
CompressOutput=no

[Content]
Bootable=no
WithDocs=no
WithRecommends=no
# apt and dpkg run from this tree, so their state stays in it.
CleanPackageMetadata=no
