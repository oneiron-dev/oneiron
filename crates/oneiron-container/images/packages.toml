# What each image of the family is made of: requests only. The resolved
# closure (name, version, arch, .deb sha256) is packages.lock.toml, which the
# first `build.py fetch --learn` writes; pins for everything outside Debian
# are in release.toml. Package names come from the existing recipes (the
# guest Dockerfiles and deploy/firecracker/build.py); nothing here is versioned
# because the frozen snapshot plus the lock fixes every version.
#
# Every variant is [base] plus its overlay: `packages` (runtime, in the image),
# `build_packages` (only in the build overlay the native build runs in),
# `native` (cargo bins built inside the image's userspace), `source_builds`
# (an external source compiled there too, offline, from its pinned archive and
# its own Cargo store), `files` (pinned repo files), `payloads` (pinned
# downloads), `launchers` (a two-line /bin/sh exec of a pinned runtime on a
# pinned entry), `trees`, `links`, `dirs`, `empty_files` (an empty regular
# file, never a link: a mountpoint a boot covers with a file bind mount),
# `owners` (explicit ownership rules) and `image` (the OCI run config).
# mkosi always installs Debian's essential set and base-files; a list names
# only what comes on top.
schema = 1

[tools]
# The tools tree: what mkosi runs while it builds the images. mke2fs reads the
# rootfs tar through libarchive; zstd unpacks a zstd-compressed .deb member;
# b3sum gives the release manifest the BLAKE3 the Firecracker pins compare.
packages = [
  "apt",
  "b3sum",
  "bash",
  "coreutils",
  "debian-archive-keyring",
  "e2fsprogs",
  "libarchive-tools",
  "libseccomp2",
  "mount",
  "python3",
  "tar",
  "xz-utils",
  "zstd",
]

[base]
# Common to every variant. The essential set is the runtime base.
packages = []
# The compilers the native build uses; absent from the final image.
build_packages = ["build-essential", "pkg-config"]

# Ownership the exporter writes because no dpkg record carries it: these are
# set by maintainer scripts, and the pinned base layer ships them so. A rule
# whose path the image lacks is skipped.
[[base.owners]]
path = "/etc/shadow"
user = "root"
group = "shadow"
mode = "0640"
why = "passwd's shadowconfig, as the pinned base layer ships it"

[[base.owners]]
path = "/etc/gshadow"
user = "root"
group = "shadow"
mode = "0640"
why = "passwd's shadowconfig, as the pinned base layer ships it"

[[base.owners]]
path = "/var/mail"
user = "root"
group = "mail"
mode = "02775"
why = "base-files, as the pinned base layer ships it"

# Guest plumbing: every variant but the vault carries it.
[base.plumbing.user]
# useradd --uid 10001 --user-group --no-create-home --home-dir /tmp guest
# (every guest Dockerfile). HOME is the run-time /tmp tmpfs, so no path in
# the image is the guest's: the existing recipes create none.
name = "guest"
uid = 10001
gid = 10001
home = "/tmp"
shell = "/bin/sh"

[[base.plumbing.native]]
package = "oneiron-container"
bin = "oneiron-fence"
dest = "/usr/local/bin/oneiron-fence"
mode = "0555"

[[base.plumbing.native]]
package = "oneiron-guest"
bin = "oneiron-guest"
dest = "/usr/local/bin/oneiron-guest"
mode = "0555"

[[base.plumbing.links]]
# /sbin is /usr/sbin in the merged-usr image: Firecracker boots init=/sbin/oneiron-guest.
path = "/usr/sbin/oneiron-guest"
target = "/usr/local/bin/oneiron-guest"

[base.plumbing.image]
user = "10001:10001"
env = ["HOME=/tmp", "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"]
entrypoint = ["/usr/local/bin/oneiron-guest", "--container"]

# -- the five variant overlays -------------------------------------------------

[variants.vault]
# The vault is its own trust domain: no guest plumbing, its own PID 1.
plumbing = false
# The init's tools (deploy/firecracker/build.py TOOLS): sh, cat, head and sync
# come with the essential set; mount and umount with `mount`; `reboot -f` is
# busybox's reboot applet, which with -f makes the reboot call itself, no init
# system asked (FIX 8978). One link, not `busybox --install`, and no setuid.
# libexpat1: expat-sys, in oneiron-server's default closure, links Debian's
# Expat through pkg-config (libexpat1-dev in the build overlay), not the
# Expat 2.1.0 its crate bundles.
packages = ["busybox", "libexpat1", "mount"]
build_packages = ["libexpat1-dev"]
links = [{ path = "/usr/bin/reboot", target = "/usr/bin/busybox" }]
files = [{ pin = "vault-init", dest = "/usr/sbin/oneiron-vault-init", mode = "0755" }]
dirs = [
  { path = "/vault" },
  { path = "/config" },
  { path = "/restore" },
  { path = "/etc/oneiron" },
]
# The resolver mountpoint: the guest network writes its nameservers to a
# runtime file and bind-mounts that file over this empty one
# (crates/oneiron-server/src/managed/vm_init/network.rs), as build.py stages it.
empty_files = [{ path = "/etc/resolv.conf", mode = "0644" }]
native = [
  { package = "oneiron-server", bin = "oneiron-server", dest = "/usr/bin/oneiron-server" },
  { package = "oneiron-server", bin = "oneiron-broker", dest = "/usr/bin/oneiron-broker" },
  { package = "oneiron-server", bin = "oneiron-vm-init", dest = "/usr/bin/oneiron-vm-init" },
  { package = "oneiron-server", bin = "oneiron-vm-outbox", dest = "/usr/bin/oneiron-vm-outbox" },
]
image = { entrypoint = ["/usr/sbin/oneiron-vault-init"] }

[variants.browser]
packages = ["busybox", "ca-certificates", "chromium", "curl", "fonts-liberation"]
native = [
  { package = "oneiron-container", bin = "oneiron-browser-relay", dest = "/usr/local/bin/oneiron-browser-relay" },
]
payloads = [{ pin = "lightpanda", dest = "/usr/local/bin/lightpanda", mode = "0555" }]
files = [{ pin = "browser-entrypoint", dest = "/usr/local/bin/oneiron-browser-guest", mode = "0555" }]
image = { env = ["LIGHTPANDA_DISABLE_TELEMETRY=true"], entrypoint = ["/usr/local/bin/oneiron-browser-guest"] }

[variants.desktop-cua]
packages = [
  "abiword", "at-spi2-core", "dbus", "dbus-x11", "fonts-liberation", "galculator", "gnumeric",
  "libatk-adaptor", "libwayland-client0", "libx11-6", "libxext6", "libxi6", "libxkbcommon0",
  "libxtst6", "mousepad", "openbox", "xauth", "xvfb",
]
build_packages = [
  "libwayland-dev", "libx11-dev", "libxext-dev", "libxi-dev", "libxkbcommon-dev", "libxtst-dev",
]
source_builds = [{ pin = "cua-driver", dest = "/usr/local/bin/cua-driver", mode = "0555" }]
files = [{ pin = "desktop-entrypoint", dest = "/usr/local/bin/oneiron-desktop-guest", mode = "0555" }]
image = { entrypoint = ["/usr/local/bin/oneiron-desktop-guest"] }

[variants.checker]
# L11-A owns these rows (guest/checker); they mirror its Dockerfile today.
packages = [
  "build-essential", "ca-certificates", "cmake", "curl", "git", "libasound2-dev", "libdbus-1-dev",
  "libgtk-3-dev", "libjavascriptcoregtk-4.1-dev", "libsoup-3.0-dev", "libwebkit2gtk-4.1-dev",
  "perl", "pkg-config", "python3",
]
files = [{ pin = "checker-helper", dest = "/usr/local/bin/oneiron-queue-check", mode = "0555" }]
# The frozen check plan (.oneiron/checks.json) runs `cargo` with
# PATH=/opt/cargo/bin:..., RUSTUP_HOME=/opt/rustup and RUSTUP_TOOLCHAIN=1.96;
# the helper itself (checker.py) needs only python3 and the store below. The
# pinned components sit where rustup-init put that toolchain, and
# /opt/cargo/bin links to them in place of rustup's proxies (no rustup binary:
# a plain cargo ignores RUSTUP_TOOLCHAIN and runs the rustc beside it on PATH).
payloads = [{ pin = "checker-rust", dest = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu" }]
links = [
  { path = "/opt/cargo/bin/cargo", target = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu/bin/cargo" },
  { path = "/opt/cargo/bin/cargo-clippy", target = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu/bin/cargo-clippy" },
  { path = "/opt/cargo/bin/cargo-fmt", target = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu/bin/cargo-fmt" },
  { path = "/opt/cargo/bin/clippy-driver", target = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu/bin/clippy-driver" },
  { path = "/opt/cargo/bin/rustc", target = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu/bin/rustc" },
  { path = "/opt/cargo/bin/rustdoc", target = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu/bin/rustdoc" },
  { path = "/opt/cargo/bin/rustfmt", target = "/opt/rustup/toolchains/1.96-x86_64-unknown-linux-gnu/bin/rustfmt" },
]
trees = [{ kind = "cargo-store", dest = "/opt/queue-check/cargo-home" }]
# The Dockerfile's ENV, with HOME=/tmp from the guest plumbing.
image = { env = [
  "CARGO_HOME=/opt/cargo",
  "PATH=/opt/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  "RUSTUP_HOME=/opt/rustup",
], entrypoint = ["/usr/local/bin/oneiron-queue-check"] }

[variants.generic-agent]
# Shell, CA roots, the guest agent and a small starter runtime: Python from
# the snapshot, Bun and tsrs from their pins (FIX 8254, 8976). No Node: the
# npm packages are unpacked where Node's resolution finds them, and the two
# public commands run their entry files under Bun. /usr/local/bin is on the
# PATH of both the OCI config and the guest's native exec.
packages = ["ca-certificates", "python3"]
payloads = [
  { pin = "bun", dest = "/usr/local/bin/bun", mode = "0555" },
  { pin = "tsrs", dest = "/opt/tsrs/node_modules/tsrs" },
  { pin = "tsrs-wasm", dest = "/opt/tsrs/node_modules/@tsrs/wasm" },
  { pin = "tsrs-linux-x64-gnu", dest = "/opt/tsrs/node_modules/@tsrs/linux-x64-gnu" },
]
launchers = [
  { path = "/usr/local/bin/tsrs", runtime = "/usr/local/bin/bun", entry = "/opt/tsrs/node_modules/tsrs/bin/tsrs" },
  { path = "/usr/local/bin/tsrs-wasm", runtime = "/usr/local/bin/bun", entry = "/opt/tsrs/node_modules/@tsrs/wasm/bin/tsrs-wasm.js" },
]
# The packages' own `bin` declarations, as npm would link them.
links = [
  { path = "/opt/tsrs/node_modules/.bin/tsrs", target = "../tsrs/bin/tsrs" },
  { path = "/opt/tsrs/node_modules/.bin/tsrs-wasm", target = "../@tsrs/wasm/bin/tsrs-wasm.js" },
]
