# Fixed defaults for every guest image of the family. build.py generates the
# per-build config that includes this file and adds the packages, the tools
# tree, the mirror paths, SourceDateEpoch and Seed from release.toml and
# packages.toml; nothing here names a package. Run images only through
# build.py, never `mkosi` in this directory.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
ManifestFormat=json
CompressOutput=no

[Content]
# Direct-boot guests: /sbin/oneiron-guest is PID 1 under Firecracker and the
# OCI entrypoint elsewhere. No kernel, bootloader, initrd or init system.
Bootable=no
WithDocs=no
WithRecommends=no
# Keeps dpkg's status (installed packages stay inspectable); drops apt's
# state where the image has no apt.
CleanPackageMetadata=auto
