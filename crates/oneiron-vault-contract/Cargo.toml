[package]
name = "oneiron-vault-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Supervisor ⇄ vault child-process contract: wire types, credential framing, limits"
publish = false

[lib]
path = "src/lib/mod.rs"
# No doc-comment code fences in this crate (audited 2026-08-19); skip the
# doctest compile pass entirely.
doctest = false

[dependencies]
anyhow = "1"
serde = { workspace = true }
subtle = "2"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tempfile = "3"
serde_json = { workspace = true }

[lints]
workspace = true
