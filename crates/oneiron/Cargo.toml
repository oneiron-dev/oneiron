[package]
name = "oneiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Embedded retrieval engine for memory-first applications"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# Doctests stay ON for this crate (audited 2026-08-19): `entity_id.rs` carries
# a `compile_fail` doctest proving ForeignWorldId cannot enter selector
# construction, and `config.rs` carries a runnable VaultConfig example. Every
# other workspace crate has zero doctest fences and sets `doctest = false`.
doctest = true

[dependencies]
heed = { workspace = true }
half = "2"
uuid = { workspace = true }
# BASE deps (not sync-gated): receipts mint — and are attested — in base
# paths, including the non-sync build (ONE-1140, OD-1/OD-2).
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
xxhash-rust = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true, optional = true }
blake3 = { workspace = true }
# SECRET-02 (ONE-1920): lease materialization returns the value wrapped in
# `zeroize::Zeroizing` so the caller's copy is scrubbed on drop. No other
# deps are added by that ticket.
zeroize = "1"
p256 = { workspace = true }
regex = { workspace = true }
futures-core = { workspace = true }
arc-swap = { workspace = true }
# ARTL-3 (OF-368 D5): the edit round-trip decomposes the OPC (ZIP) bytes a
# code-session produced so the corruption/passthrough gate verifies fidelity
# independently of the session. rust_backend (miniz_oxide) keeps it pure Rust,
# and both crates were already resolved transitively, so this adds no new deps.
flate2 = "1"
gix = { version = "0.85.0", default-features = false, features = ["revision", "sha1"] }
tiktoken-rs = "0.12.0"
sha2 = "0.10"
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.2", default-features = false, features = ["compiled_data", "auto"] }
icu_properties = { version = "2.2", default-features = false, features = ["compiled_data"] }
unicode-script = "0.5"
unicode-segmentation = "1"
loro = { version = "1.10", optional = true }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
futures-util = { version = "0.3", optional = true }
zstd = { version = "0.13", optional = true }
tracing = { version = "0.1" }
whichlang = "0.1.1"
rust-stemmers = "1.2.0"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.6.11" }
jieba-rs = { version = "0.9", default-features = false }
lindera = { version = "3.0", default-features = false }
kamadak-exif = "0.5"
ocrs = { version = "0.10", optional = true }
rten = { version = "0.21", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# CAL-01 (ONE-1783): the shared calendar dependency reservation. `chrono` +
# `chrono-tz` back the IANA conversion border in `src/calendar/tz.rs` and are
# private to it — no chrono-family type may appear in a public signature. The
# core index stays pure `u64` UTC. `icalendar` (CAL-02/CAL-04 parse/emit) and
# `rrule` (CAL-03) land in the same append so the stacked calendar layers never
# reopen this manifest. `default-features = false` on chrono states this crate's
# own need — the border converts, it never reads a system clock or a host zone.
# Note that `rrule` depends on chrono with defaults, so feature unification
# still resolves chrono with `clock`; the flag is intent, not an achieved
# tree-wide floor.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
icalendar = "0.17"
rrule = "0.14"

# CMT-02 (ONE-1539): the commitment RECURRENCE vocabulary
# (`oneiron_vault_contract::commitment::{Schedule, QuotaWindow}`) is shared
# with the supervisor seam, so the engine consumes the contract's spelling
# rather than declaring a second one. The dependency is types-only — nothing
# in this crate speaks the child-process wire.
oneiron-vault-contract = { version = "0.1.0", path = "../oneiron-vault-contract" }

# ONE-1148 (owner-approved POSIX-sem build, M5 kickoff 2026-06-13): macOS
# LMDB otherwise defaults to SysV semaphores (mdb.c picks MDB_USE_SYSV_SEM
# on __APPLE__) whose semget key comes from ftok(lockfile, 'M') — ~24 bits
# of lockfile inode, so concurrent test vaults collide, and an env close on
# one collided vault IPC_RMIDs the semaphore set out from under the other
# (random EINVAL(22) on Vault::open / write txns under parallel test load).
# The posix-sem build instead names semaphores "/MDB" + base85 of a 64-bit
# FNV-1a hash of the lockfile's (st_dev, st_ino), and close only
# sem_unlinks the NAME (open handles stay valid) — both legs of the
# collision class are structurally gone.
#
# Target-gated on purpose: lmdb-master-sys's build.rs applies the
# MDB_USE_POSIX_SEM define unconditionally whenever the feature is on, and
# on Linux that would REPLACE the default robust pthread mutexes
# (MDB_USE_POSIX_MUTEX + MDB_USE_ROBUST, crash-recoverable) with
# non-robust POSIX semaphores. Linux CI keeps the stock lock
# implementation; the workspace's resolver = "2" keeps this feature out of
# non-macOS builds.
[target.'cfg(target_os = "macos")'.dependencies]
heed = { workspace = true, features = ["posix-sem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
image-station-ocr = ["dep:ocrs", "dep:rten"]
artifact-publish-verb = []
# CODE-01 (ONE-1429): the isolating microVM backend for foreign/ingested guest
# code. Linux-only (Firecracker is a KVM VMM), off by default, and even with
# the feature on `FirecrackerBackend::detect` returns None unless the host
# actually has the VMM — so a feature-on build without a VMM still fails closed.
microvm-firecracker = []
# Compiles in the dev reference microVM backend outside debug builds. It
# reproduces the boundary discipline (overlay writes become proposals,
# credentials resolve behind a destination allowlist) but is NOT a security
# boundary: no VMM, no kernel isolation. `select_backend_for_tier` will only
# ever hand it to a release build when this feature is explicitly on.
microvm-dev = []
sync = [
    "loro",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:zstd",
    "dep:postcard",
]
# Compiles in cross-crate test-only fault-injection seams (e.g. the lease
# mirror-failure hook for ONE-1140's root-snapshot/`ls:`-mirror atomicity
# test in `oneiron-server`). No production effect; enabled only by
# downstream crates' dev-dependencies.
test-hooks = []
# Compiles in `Vault::open_unseeded_for_test` — the only way to open a vault
# without seeding the default policy manifest (the effect-spine oracle needs
# it). Enabled only via the self dev-dependency below. Even under
# `--all-features` the production `Vault::open` path always seeds; the unseeded
# opener is an explicit test-named function, not a silent config field.
test-support = []

[dev-dependencies]
# Self dev-dependency that turns on `test-support` for this crate's own tests
# (the effect-spine oracle needs the unseeded-vault opening seam). Keeps
# nextest / CI / verify.sh flag-free — no --features needed.
oneiron = { path = ".", features = ["test-support"] }
tempfile = "3"
rand = "0.8"
proptest = "1"
# ONE-1572 (B11-2b): compile-fail proof that the sealed relay-attestation
# witness cannot be constructed outside the boundary. Dev-only; no runtime
# dependency is added.
trybuild = "1"
# Integration tests forge/sign attested receipts independently of the
# engine's signer (contract-grounded test vectors, ONE-1140).
ed25519-dalek = { workspace = true }
yrs = { version = "0.25", features = ["sync"] }

# The consolidated sync-cluster integration binary. The feature gate lives
# here at the target level, so the whole cluster (including the formerly
# undeclared `#![cfg(feature = "sync")]` files it absorbed) is skipped —
# not silently compiled to empty binaries — when `sync` is off.
# `tests/it/main.rs` (default features) and the standalone trybuild target
# `tests/relay_attestation_compilefail.rs` are auto-discovered.
[[test]]
name = "it_sync"
path = "tests/it_sync/main.rs"
required-features = ["sync"]

[[bench]]
name = "sync_memory"
harness = false
required-features = ["sync"]

[lints]
workspace = true
