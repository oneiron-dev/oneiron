[package]
name = "oneiron-uniffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI binding of the Oneiron SDK over the shared OneironClient (embedded and remote)."
publish = false

[lib]
# `cdylib` carries the UniFFI metadata bindgen reads in library mode;
# `staticlib` is what the Swift compile stub links; `rlib` lets the local
# bindgen binary and the contract tests depend on this crate.
crate-type = ["rlib", "cdylib", "staticlib"]
# No doc-comment code fences in this crate (audited 2026-08-19); skip the
# doctest compile pass entirely.
doctest = false

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen-cli"]

[features]
# Local, version-locked bindgen entry point: the generator can never drift
# from the `uniffi` runtime this crate compiles against.
bindgen-cli = ["uniffi/cli"]
# `EmbeddedEngine` and `AppHostCallbacks`. Off by default, so the binding
# builds exactly as before; build them with
# `cargo build -p oneiron-uniffi --features engine`.
engine = [
  "dep:oneiron-server",
  "dep:oneiron-vault-contract",
  "dep:anyhow",
  "dep:zeroize",
]

[dependencies]
oneiron = { path = "../oneiron" }
# OF-237: the shared SDK backend. This crate reaches an embedded or remote
# vault THROUGH it, as the napi and Python bindings do, and never depends on
# an HTTP client directly.
oneiron-remote = { path = "../oneiron-remote" }
# OF-237 slice 2, behind `engine`: the embedded engine. The full server runs
# in the app's process (`oneiron_server::embedded`), the app's callbacks are
# its host (`AppHost`), and their secrets cross as `Zeroizing` bytes.
oneiron-server = { path = "../oneiron-server", optional = true }
oneiron-vault-contract = { path = "../oneiron-vault-contract", optional = true }
anyhow = { version = "1", optional = true }
zeroize = { version = "1", optional = true }
# Blob bytes cross as `Vec<u8>`; the shared client's blob request carries
# them base64-encoded.
base64 = "0.22"
# The `WireJson` leaf: a row with no UniFFI record is parsed into its engine
# input type and written from its typed output.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
uniffi = "0.29"

[dev-dependencies]
# Lint parity with the workspace-wide clippy gate: `cargo clippy --workspace
# --all-features --all-targets` compiles core with every feature on and its
# own test targets alongside, but the narrow `-p oneiron-uniffi
# --all-targets` clippy/test runs build core as a lib-only dependency. In
# that resolution, core helpers whose only non-test callers live behind the
# `sync` / `test-hooks` features read as dead code under `-D warnings`. This
# dev-only edge unifies the features for those runs; the shipped library
# target itself never builds with them.
oneiron = { path = "../oneiron", features = ["sync", "test-hooks"] }

[lints]
workspace = true
