[package]
name = "oneiron-guest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded Linux PID-1 agent for Oneiron Firecracker guests"
publish = false

[dependencies]
oneiron-sandbox-contract = { path = "../oneiron-sandbox-contract" }
blake3 = "1"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasmtime = { version = "=48.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
wat = "1"

# Only the Linux guest's container fence, egress relay and native mounts use these.
[target.'cfg(target_os = "linux")'.dependencies]
oneiron-container = { path = "../oneiron-container" }
tar = { version = "=0.4.46", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
