[package]
name = "oneiron-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Android JNI adapter for the embedded Oneiron engine"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
oneiron = { path = "../oneiron" }
jni = "0.21.1"
# OF-237 slice 2, behind `engine`: the Kotlin `EmbeddedEngine` runs the full
# server in the app's process (`oneiron_server::embedded`), the Kotlin
# `AppHost` is its host (`AppHost`), and the keychain's secrets cross as
# `Zeroizing` bytes.
oneiron-server = { path = "../oneiron-server", optional = true }
oneiron-vault-contract = { path = "../oneiron-vault-contract", optional = true }
anyhow = { version = "1", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# The Kotlin `EmbeddedEngine`'s native half. Off by default, so the plain
# `EmbeddedVault` library builds exactly as before; build the engine with
# `cargo build -p oneiron-android --features engine`.
engine = [
  "dep:oneiron-server",
  "dep:oneiron-vault-contract",
  "dep:anyhow",
  "dep:zeroize",
]

[lints]
workspace = true
