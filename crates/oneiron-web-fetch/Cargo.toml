[package]
name = "oneiron-web-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Web acquisition of the oneiron engine: the fetch and crawl vocabulary and the renderer ladder"
repository.workspace = true

[dependencies]
dom_smoothie = "0.18"
encoding_rs = "0.8"
# The K door only (PLAN-UC-04 6.2): the content hash keeps its bytes. `record` off.
oneiron-fingerprint = { version = "0.1.0", path = "../oneiron-fingerprint", default-features = false }
oneiron-hex = { version = "0.1.0", path = "../oneiron-hex" }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "json",
    "rustls-tls-native-roots",
] }
schemars = "=0.8.22"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["net", "sync", "time"] }

[dev-dependencies]
# The pinned content hash test (`web_fetch/tests.rs`) recomputes the hash by hand.
blake3 = { workspace = true, features = ["zeroize"] }

[lints]
workspace = true
