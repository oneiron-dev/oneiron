[package]
name = "oneiron-records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Engine-internal stored record types below the oneiron engine: side-table payloads, receipts, queue rows and checkpoint parts"
repository.workspace = true
homepage.workspace = true

[lib]
doctest = false

[dependencies]
blake3 = { workspace = true, features = ["zeroize"] }
heed = { workspace = true }
loro = { workspace = true }
oneiron-authority = { version = "0.1.0", path = "../oneiron-authority" }
oneiron-base = { version = "0.1.0", path = "../oneiron-base" }
oneiron-browser = { path = "../oneiron-browser", default-features = false }
oneiron-code-source = { version = "0.1.0", path = "../oneiron-code-source" }
oneiron-consent-state = { version = "0.1.0", path = "../oneiron-consent-state" }
oneiron-container = { path = "../oneiron-container" }
oneiron-contracts = { version = "0.1.0", path = "../oneiron-contracts" }
oneiron-crypto = { version = "0.1.0", path = "../oneiron-crypto" }
oneiron-delivery-vocabulary = { version = "0.1.0", path = "../oneiron-delivery-vocabulary" }
oneiron-docedit = { version = "0.1.0", path = "../oneiron-docedit" }
oneiron-lens-wire = { version = "0.1.0", path = "../oneiron-lens-wire" }
oneiron-linkedin-policy = { version = "0.1.0", path = "../oneiron-linkedin-policy" }
oneiron-model = { version = "0.1.0", path = "../oneiron-model" }
oneiron-policy-vocabulary = { version = "0.1.0", path = "../oneiron-policy-vocabulary" }
oneiron-retrieval = { version = "0.1.0", path = "../oneiron-retrieval" }
oneiron-store = { version = "0.1.0", path = "../oneiron-store" }
oneiron-vault-contract = { version = "0.1.0", path = "../oneiron-vault-contract" }
oneiron-verb-wire = { version = "0.1.0", path = "../oneiron-verb-wire" }
oneiron-wake-contract = { version = "0.1.0", path = "../oneiron-wake-contract" }
oneiron-web-fetch = { version = "0.1.0", path = "../oneiron-web-fetch" }
oneiron-xlsx-formula = { version = "0.1.0", path = "../oneiron-xlsx-formula" }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "json",
    "http2",
    "rustls-tls-native-roots",
] }
rmp-serde = { workspace = true }
rmpv = { workspace = true, features = ["with-serde"] }
schemars = "=0.8.22"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
thiserror = { workspace = true }
zeroize = "1"

[features]
# Forwarded from `oneiron/sync` and `oneiron/test-support`: a moved item keeps the gate it had in the engine, and
# a lower crate gets the features the engine gives it.
sync = ["oneiron-contracts/sync", "oneiron-base/sync", "oneiron-store/sync", "oneiron-wake-contract/sync", "oneiron-verb-wire/sync"]
test-support = ["oneiron-contracts/test-support", "oneiron-base/test-support", "oneiron-store/test-support", "oneiron-docedit/test-support", "oneiron-model/test-support", "oneiron-verb-wire/test-support"]
test-hooks = ["oneiron-model/test-hooks", "oneiron-store/test-hooks", "oneiron-verb-wire/test-hooks"]

[lints]
workspace = true
