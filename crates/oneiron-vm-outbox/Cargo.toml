[package]
name = "oneiron-vm-outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A vault VM's root outbox companion"
repository.workspace = true
publish = false

# A vault VM's root outbox companion (FIX 5235): oneiron-vm-init starts it
# beside the server; it lays out the vault disk's outbox and carries every
# outbox kind to and from the host over vsock port 1030. Its own package, not
# a bin of oneiron-server, so a server test build never links it.
[[bin]]
name = "oneiron-vm-outbox"
path = "src/main.rs"
doc = false

[dependencies]
oneiron-server = { version = "0.1.0", path = "../oneiron-server" }

[lints]
workspace = true
