[package]
name = "oneiron-mesh-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Engine mesh transport seam and private iroh adapter"
repository.workspace = true

[features]
default = []
iroh = ["dep:iroh", "dep:futures-util", "dep:n0-future", "dep:n0-error"]

[dependencies]
oneiron = { path = "../oneiron" }
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }
iroh = { git = "https://github.com/oneiron-dev/iroh", rev = "17c0612f80f78f5288e97b818b1360ae6ea0a51a", optional = true, default-features = false, features = ["tls-ring"] }
futures-util = { version = "0.3", optional = true }
n0-future = { version = "0.3", optional = true }
n0-error = { version = "1", optional = true }
serde = { workspace = true, features = ["derive"] }
rmp-serde = { workspace = true }

[dev-dependencies]
tempfile = "3"
