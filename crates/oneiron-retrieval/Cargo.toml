[package]
name = "oneiron-retrieval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Retrieval kernels of the oneiron engine: the multilingual analyzer, cosine distance and score fusion"
repository.workspace = true
homepage.workspace = true

[lib]
# No doc-comment code fences in this crate.
doctest = false

[dependencies]
oneiron-contracts = { version = "0.1.0", path = "../oneiron-contracts" }
rmpv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.2", default-features = false, features = ["compiled_data", "auto"] }
icu_properties = { version = "2.2", default-features = false, features = ["compiled_data"] }
unicode-script = "0.5"
unicode-segmentation = "1"
whichlang = "0.1.1"
rust-stemmers = "1.2.0"
# Upstream v0.6.11 plus fork branch oneiron/v0.6.11: Android plugin-loader name, reasoned allows.
sudachi = { git = "https://github.com/oneiron-dev/sudachi.rs", rev = "d8cba3609521805ebf35bfc2b71d8099a13befef" }
jieba-rs = { version = "0.9", default-features = false }
lindera = { version = "3.0", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
# Unchecked EntityId bytes for the fusion fixtures; test builds only.
oneiron-contracts = { version = "0.1.0", path = "../oneiron-contracts", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
