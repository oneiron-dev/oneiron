[package]
name = "oneiron-image-comfyui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-hosted ComfyUI wire adapter for the Oneiron image backend"
repository.workspace = true

[lib]
doctest = false

[dependencies]
oneiron = { version = "0.1.0", path = "../oneiron" }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
oneiron = { version = "0.1.0", path = "../oneiron", features = ["test-hooks"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
