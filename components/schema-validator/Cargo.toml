[package]
name = "oneiron-schema-validator-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
serde_json = "=1.0.151"
getrandom = "=0.3.4"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
