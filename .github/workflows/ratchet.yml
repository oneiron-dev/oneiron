name: Ratchet

# MAIN ONLY, deliberately. The ratchet counts whole-repo metrics (files over
# 800 lines, `#[allow(...)]` attributes, print macros), and a stacked wave
# moves those counts around inside itself: a split PR can add a file the next
# PR deletes, so a middle commit can sit transiently above baseline for a
# state that never lands on main. A per-PR trigger would fail those commits
# for nothing. Main is the only tree whose counts are the real ones, so main
# is where the baseline is enforced.
#
# No pull_request. No schedule. `scripts/ratchet/check.sh` fails closed —
# RATCHET-ERROR (unreadable baseline, broken `rg`, empty scan) and
# RATCHET-FAIL (a metric above baseline) both exit 1, so the job's exit code
# is the whole verdict and both print their reason in the log.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ratchet-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ratchet:
    name: Baseline ratchet
    # Self-hosted macOS runner (HYG-06b, see ci.yml's runner header);
    # CI_PAUSED is the wave switch shared with ci.yml. ripgrep is part of
    # the runner host contract (AGENTS.md "Self-hosted runners"), so the old
    # apt-get install step is gone.
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 15
    if: vars.CI_PAUSED != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      # check.sh treats a missing `rg` as RATCHET-ERROR; name the host gap
      # before the scan runs rather than discovering it as a hard failure
      # with nothing measured.
      - name: Host tools
        run: rg --version
      - name: Check ratchet baselines
        run: scripts/ratchet/check.sh
      # The committed code map (docs/CODEMAP.md, docs/codemap/) is generated;
      # a stale map is CODEMAP-STALE and the regenerate hint is in the log.
      - name: Check code map
        run: scripts/codemap/check.sh
      # Same main-only rationale as the counts: a stacked wave reshapes
      # lib.rs transiently, so main is the only tree whose surface is real.
      - name: Check root-surface pin
        run: scripts/ratchet/root-surface-check.sh
