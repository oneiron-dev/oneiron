name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Format
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: clippy
      - uses: useblacksmith/rust-cache@v3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
      - uses: useblacksmith/rust-cache@v3
      - uses: taiki-e/install-action@nextest
      # Canonical runner (ONE-1144): process-per-test isolation, full tier.
      - run: cargo nextest run --workspace --all-features --profile full
      # nextest does not run doctests; keep them covered separately.
      - run: cargo test --doc --workspace --exclude oneiron-bench --all-features

  package:
    name: Package oneiron-server
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      LOCAL_ONEIRON_PATCH: 'patch.crates-io.oneiron.path="crates/oneiron"'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.96"
      - uses: useblacksmith/rust-cache@v3
      - run: rm -rf target/package/oneiron-server-*
      - run: cargo package -p oneiron-server --list --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: cargo package -p oneiron-server --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: |
          package_manifest="$(find target/package -mindepth 2 -maxdepth 2 -path 'target/package/oneiron-server-*/Cargo.toml' -print -quit)"
          test -n "${package_manifest}"
          cargo test --manifest-path "${package_manifest}" --all-features --config "${LOCAL_ONEIRON_PATCH}"

  deny:
    name: cargo-deny
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    name: typos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.45.1
