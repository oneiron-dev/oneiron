name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings -Cdebuginfo=0"

# A superseded PR push's in-flight run is pure spend — cancel it. Main
# pushes get a per-sha group: never cancelled, never queued behind each
# other on rapid merges.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cost layout (2026-07-09): Rust jobs are gated off PRs whose diff can't
# change their outcome (refactor manifests/tooling, docs). fmt/clippy run
# PR-only; Test runs on PRs (rust diffs) AND every main push as the record
# of truth; package (publish-integrity) runs on main pushes only. deny and
# typos are seconds — they run on every PR unfiltered.
jobs:
  changes:
    name: Detect changed paths
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # paths-filter reads PR changed-files via the REST API — grant it
    # explicitly so a restricted default GITHUB_TOKEN can't strand PRs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # docs/ops/** and the root skills pack are include_str!'d /
          # compared by contract tests (ops_docs.rs, skills_pack.rs) —
          # they are rust-relevant despite living outside crates/.
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
              - 'docs/ops/**'
              - 'oneiron.skills.md'
              - 'packages/prompts/**'

  fmt:
    name: Format
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: clippy
      # Sticky disks replace rust-cache: no tar/prune/upload cycle (the old
      # Post-save step cost 71-143s); disks mount in ~3s and commit on unmount.
      # Guarded off for fork PRs so a fork can never poison shared build state
      # (cold build there is the correct fallback). Registry disk is shared
      # across jobs; target disk is per-job. $0.50/GB/mo — if disks bloat over
      # months, add a scheduled useblacksmith/stickydisk-delete cleanup.
      - name: Mount cargo registry (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Mount target dir (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-target-clippy
          path: ./target
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    # PRs test on ARM (0.625x cost) — the agent/logic code is arch-portable, so
    # PR-CI's real job runs fine there. main pushes + release tags test on x86,
    # the production arch. Both hand-written SIMD paths (AVX2 on x86, NEON on
    # arm — crates/oneiron/src/distance.rs) thus get CI coverage across the
    # PR -> merge -> release lifecycle. cargo-deny/clippy/package stay x86.
    # 4vcpu on the PR lane: the suite's wall time stops scaling past ~4
    # cores (full x86 suite measured 2026-07-19: ~361s at 8vcpu vs ~360s at
    # 4vcpu), so 8vcpu bills ~2x the vcpu-seconds for no latency gain.
    # Revert to 8vcpu-arm if warm PR runs come in over ~2x the old ~220s.
    runs-on: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404-arm' || 'blacksmith-8vcpu-ubuntu-2404' }}
    needs: changes
    # Always on main pushes (record of truth) — always() keeps that true
    # even if the detector job itself fails; on PRs only for rust diffs.
    if: always() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
      # Sticky disks replace rust-cache: no tar/prune/upload cycle (the old
      # Post-save step cost 71-143s); disks mount in ~3s and commit on unmount.
      # Guarded off for fork PRs so a fork can never poison shared build state
      # (cold build there is the correct fallback). Registry disk is shared
      # across jobs; target disk is per-job. $0.50/GB/mo — if disks bloat over
      # months, add a scheduled useblacksmith/stickydisk-delete cleanup.
      - name: Mount cargo registry (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Mount target dir (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          # Arch-specific: the PR (arm) and main-push (x86) lanes must not share
          # a target dir, or cargo rebuilds cold every switch. -arm on PRs.
          key: ${{ github.repository }}-target-test${{ github.event_name == 'pull_request' && '-arm' || '' }}
          path: ./target
      - uses: taiki-e/install-action@nextest
      # Canonical runner (ONE-1144): process-per-test isolation. Main pushes
      # run the full tier (record of truth); PRs run the fast `ci-pr` tier
      # (skips the ~130s slow set but keeps retries=2 — the `default` tier is
      # retries=0 for the local fail-fast loop, which we must NOT inherit on
      # CI). A slow-set regression surfaces on the next main-push full run.
      - run: cargo nextest run --workspace --all-features --profile ${{ github.event_name == 'push' && 'full' || 'ci-pr' }}
      # nextest does not run doctests; keep them covered separately.
      - run: cargo test --doc --workspace --exclude oneiron-bench --all-features

  package:
    name: Package oneiron-server
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Publish-integrity + standalone-build check. Not needed per-merge at
    # 0.1.0 (we don't publish every merge) — gate to release tags only, so
    # it stops billing on every main push. A packaging/standalone break
    # surfaces when a `v*` tag is cut; revisit (weekly cron / paths-gate) if
    # that release-window ever bites.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      LOCAL_ONEIRON_PATCH: 'patch.crates-io.oneiron.path="crates/oneiron"'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.96"
      # Sticky disks replace the previous rust-cache here too (each run was
      # paying a ~400MB actions-cache save/restore cycle). Runs on main
      # pushes only, so the fork guard is inert but kept for uniformity.
      - name: Mount cargo registry (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Mount target dir (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-target-package
          path: ./target
      - run: rm -rf target/package/oneiron-server-*
      - run: cargo package -p oneiron-server --list --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: cargo package -p oneiron-server --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: |
          package_manifest="$(find target/package -mindepth 2 -maxdepth 2 -path 'target/package/oneiron-server-*/Cargo.toml' -print -quit)"
          test -n "${package_manifest}"
          cargo test --manifest-path "${package_manifest}" --all-features --config "${LOCAL_ONEIRON_PATCH}"

  deny:
    name: cargo-deny
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    name: typos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.45.1
