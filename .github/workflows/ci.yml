name: CI

# Scoped CI (owner ruling 2026-09-26: "test only the part that was relevant ... radically cut and minimize it").
#
# A PR or a main push builds and tests what its diff touched, and nothing else:
#   * `changes` runs scripts/ci/ci_scope.py on the diff: the touched workspace packages, and for the `oneiron`
#     crate the touched top-level modules (more than 12, or a crate-root file, means all of the crate).
#   * `Checks`: fmt, then clippy -D warnings for the touched packages (plus the featureless build when `oneiron`
#     changed); cargo-deny only when Cargo.lock or deny.toml changed; the tooling tests only when scripts/ or
#     .github/ changed.
#   * `Test`: nextest for the touched packages; for `oneiron`, the lib tests of the touched modules, and the
#     integration tests only when crates/oneiron/tests changed. No doctests on PRs.
#   * `Test (featureless)`: the shared-process featureless lane (`cargo test`) for the touched modules.
# The full gate runs once a night (schedule, 03:00 JST), on manual dispatch, and whenever a build file changes
# (root Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo/, clippy/rustfmt/nextest config): workspace clippy
# in three feature graphs, strict rustdoc, the whole nextest suite, doctests, and both featureless process
# models (W8-T41: libtest threads in one process, then nextest one process per test). The macOS recipe and the
# mutation audit run on dispatch only.
#
# `Checks`, `Test` and `Test (featureless)` are required contexts on main, so the three jobs always report; a
# diff with nothing Rust-relevant runs their cheap steps and goes green. Draft PRs skip every job.
# CI_PAUSED=true skips every job.
#
# Runners: our own machines. `changes`, `Checks` and both scoped test jobs run on the Linux runners; the Macs
# take only the dispatch-only macOS recipe and mutation audit. Caches are the host's: each runner's `.env` exports a persistent CARGO_TARGET_DIR,
# CARGO_INCREMENTAL=0 and a PATH with ~/.cargo/bin; the toolchain is host rustup via rust-toolchain.toml. Never
# set CARGO_TARGET_DIR here. PR Cargo steps unset the runner's CARGO_INCREMENTAL=0 and select
# incremental dev/test profiles; main pushes, scheduled and dispatch builds keep non-incremental profiles.
# sccache remains the compiler wrapper for non-incremental dependencies (never set CARGO_INCREMENTAL=1).
# run_scoped.sh gives only oneiron a parallel front end for build/test and selects tmpfs for Linux tests
# when /dev/shm has >=12 GiB free; otherwise it keeps the disk TMPDIR.
# `clean: true` on every checkout because `_work` persists between runs.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'

env:
  CARGO_TERM_COLOR: always

# One run per PR (a newer push cancels the older run); every main push keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    if: vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      full: ${{ steps.scope.outputs.full }}
      packages: ${{ steps.scope.outputs.packages }}
      oneiron: ${{ steps.scope.outputs.oneiron }}
      modules: ${{ steps.scope.outputs.modules }}
      it: ${{ steps.scope.outputs.it }}
      deny: ${{ steps.scope.outputs.deny }}
      pytools: ${{ steps.scope.outputs.pytools }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Scope of this run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            schedule | workflow_dispatch) python3 scripts/ci/ci_scope.py --full ;;
            pull_request) python3 scripts/ci/ci_scope.py --base "$PR_BASE" --head HEAD ;;
            *) python3 scripts/ci/ci_scope.py --base "$PUSH_BEFORE" --head HEAD ;;
          esac

  checks:
    name: Checks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    needs: changes
    if: >-
      always()
      && vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      CARGO_PROFILE_DEV_INCREMENTAL: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      CARGO_PROFILE_TEST_INCREMENTAL: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      SCOPE_FULL: ${{ needs.changes.outputs.full || 'true' }}
      SCOPE_PACKAGES: ${{ needs.changes.outputs.packages }}
      SCOPE_ONEIRON: ${{ needs.changes.outputs.oneiron }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Shared compiler cache (sccache 0.15.0)
        if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != '' || needs.changes.result != 'success') }}
        run: |
          cargo install --locked sccache@0.15.0 --root "$HOME/ci/tools"
          echo "RUSTC_WRAPPER=$HOME/ci/tools/bin/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/ci/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=10G" >> "$GITHUB_ENV"
          "$HOME/ci/tools/bin/sccache" --version
      - name: Toolchain (host rustup, pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          cargo --version
      - name: Secret blocklist is a policy superset
        run: python3 scripts/check-secret-blocklist.py
      - name: Code map is current
        if: ${{ !cancelled() }}
        run: scripts/codemap/check.sh
      - name: Format
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success') }}
        run: cargo fmt --check
      - name: Clippy (touched packages; the full gate nightly)
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success') }}
        run: env -u CARGO_INCREMENTAL scripts/ci/run_scoped.sh clippy
      - name: typos 1.45.1 (host-local pin under ~/ci/tools)
        if: ${{ !cancelled() }}
        run: |
          cargo install --locked typos-cli@1.45.1 --root "$HOME/ci/tools"
          "$HOME/ci/tools/bin/typos"
      - name: cargo-deny 0.19.4 (only when the dependency policy inputs changed)
        if: ${{ !cancelled() && (needs.changes.outputs.deny == 'true' || needs.changes.outputs.full == 'true' || needs.changes.result != 'success') }}
        run: |
          cargo install --locked cargo-deny@0.19.4 --root "$HOME/ci/tools"
          "$HOME/ci/tools/bin/cargo-deny" --locked check
      - name: Test build and navigation tools (only when scripts or CI changed)
        if: ${{ !cancelled() && (needs.changes.outputs.pytools == 'true' || needs.changes.outputs.full == 'true' || needs.changes.result != 'success') }}
        run: |
          # The deny-policy tests call the pinned cargo-deny.
          cargo install --locked cargo-deny@0.19.4 --root "$HOME/ci/tools"
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_codemap.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_verify.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_ci_workflow.py' -v
          python3 scripts/sdk/generate.py --check
          python3 -m unittest discover -s scripts/tests -p 'test_agent_sdk.py' -v
          python3 scripts/code-sandbox/generate.py --check
          python3 -m unittest discover -s scripts/tests -p 'test_sandbox_wit.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_microvm_artifacts.py' -v
          python3 -m unittest discover -s scripts/audit -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_quickjs_build.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_federation_burst_audit.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_fleet_regression.py' -v
      - name: Cap the build cache
        if: always()
        run: scripts/ci/cap-target-cache.sh 20

  test:
    name: Test (macOS)
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 90
    if: vars.CI_PAUSED != 'true' && github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WORKSPACE_WRAPPER: ${{ github.workspace }}/scripts/ci/rustc-threads.sh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Toolchain (host rustup, pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          cargo --version
      - name: cargo-nextest (host copy, else a pinned install under ~/ci/tools)
        run: |
          echo "$HOME/ci/tools/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ci/tools/bin:$PATH"
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install --locked cargo-nextest@0.9.137 --root "$HOME/ci/tools"
          fi
      - name: Workspace tests (nextest, full tier, macOS recipe)
        run: cargo nextest run --workspace --exclude oneiron-napi --exclude oneiron-bench --all-features --profile full --no-fail-fast
      - name: Featureless oneiron library tests
        run: cargo test -p oneiron --lib --no-default-features
      - name: Featureless oneiron library tests (nextest, no retries)
        run: cargo nextest run -p oneiron --lib --no-default-features --profile featureless --no-fail-fast --retries 0
      - name: Cap the build cache
        if: always()
        run: scripts/ci/cap-target-cache.sh 20

  test-linux:
    name: Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    needs: changes
    if: >-
      always()
      && vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      CARGO_PROFILE_DEV_INCREMENTAL: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      CARGO_PROFILE_TEST_INCREMENTAL: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      SCOPE_FULL: ${{ needs.changes.outputs.full || 'true' }}
      SCOPE_PACKAGES: ${{ needs.changes.outputs.packages }}
      SCOPE_ONEIRON: ${{ needs.changes.outputs.oneiron }}
      SCOPE_MODULES: ${{ needs.changes.outputs.modules }}
      SCOPE_IT: ${{ needs.changes.outputs.it }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Shared compiler cache (sccache 0.15.0)
        if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.oneiron == 'true' || needs.changes.outputs.packages != '' || needs.changes.result != 'success') }}
        run: |
          cargo install --locked sccache@0.15.0 --root "$HOME/ci/tools"
          echo "RUSTC_WRAPPER=$HOME/ci/tools/bin/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/ci/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=10G" >> "$GITHUB_ENV"
          "$HOME/ci/tools/bin/sccache" --version
      - name: Toolchain (host rustup, pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          cargo --version
      - name: cargo-nextest (host copy, else a pinned install under ~/ci/tools)
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success') }}
        run: |
          echo "$HOME/ci/tools/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ci/tools/bin:$PATH"
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install --locked cargo-nextest@0.9.137 --root "$HOME/ci/tools"
          fi
          cargo nextest --version
      - name: Tests (touched packages and modules; everything nightly)
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success') }}
        run: env -u CARGO_INCREMENTAL scripts/ci/run_scoped.sh test

  test-linux-featureless:
    name: Test (featureless)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    needs: changes
    if: >-
      always()
      && vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      CARGO_PROFILE_DEV_INCREMENTAL: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      CARGO_PROFILE_TEST_INCREMENTAL: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      SCOPE_FULL: ${{ needs.changes.outputs.full || 'true' }}
      SCOPE_ONEIRON: ${{ needs.changes.outputs.oneiron }}
      SCOPE_MODULES: ${{ needs.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Shared compiler cache (sccache 0.15.0)
        if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.oneiron == 'true' || needs.changes.result != 'success') }}
        run: |
          cargo install --locked sccache@0.15.0 --root "$HOME/ci/tools"
          echo "RUSTC_WRAPPER=$HOME/ci/tools/bin/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/ci/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=10G" >> "$GITHUB_ENV"
          "$HOME/ci/tools/bin/sccache" --version
      - name: Toolchain (host rustup, pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          cargo --version
      - name: cargo-nextest (host copy, else a pinned install under ~/ci/tools)
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success') }}
        run: |
          echo "$HOME/ci/tools/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ci/tools/bin:$PATH"
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install --locked cargo-nextest@0.9.137 --root "$HOME/ci/tools"
          fi
          cargo nextest --version
      - name: Featureless oneiron library tests (touched modules; both process models nightly)
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success') }}
        run: env -u CARGO_INCREMENTAL scripts/ci/run_scoped.sh featureless

  package:
    name: Package oneiron-server
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    if: >-
      vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      LOCAL_ONEIRON_PATCH: 'patch.crates-io.oneiron.path="crates/oneiron"'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          clean: true
      - name: Toolchain (host rustup, pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          cargo --version
      - run: rm -rf "${CARGO_TARGET_DIR:-target}/package/oneiron-server-"*
      - run: cargo package -p oneiron-server --list --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: cargo package -p oneiron-server --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: |
          package_dir="${CARGO_TARGET_DIR:-target}/package"
          package_manifest="$(find "${package_dir}" -mindepth 2 -maxdepth 2 -path "${package_dir}/oneiron-server-*/Cargo.toml" -print -quit)"
          test -n "${package_manifest}"
          cargo test --manifest-path "${package_manifest}" --all-features --config "${LOCAL_ONEIRON_PATCH}"

  mutation-audit:
    name: Mutation audit
    permissions:
      contents: read
    runs-on: [self-hosted]
    timeout-minutes: 180
    if: vars.CI_PAUSED != 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned mutant runner
        run: |
          cargo install --locked cargo-mutants@27.1.0 --root "$HOME/ci/tools"
          echo "$HOME/ci/tools/bin" >> "$GITHUB_PATH"
      - name: Mutation audit of the whole engine
        run: python3 scripts/audit/mutation.py --all-engine
      - name: Mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-audit-${{ github.sha }}
          path: target/mutation-audit/outcomes.json
          if-no-files-found: ignore
