name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings -Cdebuginfo=0"

# A superseded PR push's in-flight run is pure spend — cancel it. Never
# cancel main-push runs (record of truth).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cost layout (2026-07-09): Rust jobs are gated off PRs whose diff can't
# change their outcome (refactor manifests/tooling, docs). fmt/clippy run
# PR-only; Test runs on PRs (rust diffs) AND every main push as the record
# of truth; package (publish-integrity) runs on main pushes only. deny and
# typos are seconds — they run on every PR unfiltered.
jobs:
  changes:
    name: Detect changed paths
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: clippy
      # Sticky disks replace rust-cache: no tar/prune/upload cycle (the old
      # Post-save step cost 71-143s); disks mount in ~3s and commit on unmount.
      # Guarded off for fork PRs so a fork can never poison shared build state
      # (cold build there is the correct fallback). Registry disk is shared
      # across jobs; target disk is per-job. $0.50/GB/mo — if disks bloat over
      # months, add a scheduled useblacksmith/stickydisk-delete cleanup.
      - name: Mount cargo registry (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Mount target dir (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-target-clippy
          path: ./target
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    # Always on main pushes (record of truth); on PRs only for rust-relevant diffs.
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
      # Sticky disks replace rust-cache: no tar/prune/upload cycle (the old
      # Post-save step cost 71-143s); disks mount in ~3s and commit on unmount.
      # Guarded off for fork PRs so a fork can never poison shared build state
      # (cold build there is the correct fallback). Registry disk is shared
      # across jobs; target disk is per-job. $0.50/GB/mo — if disks bloat over
      # months, add a scheduled useblacksmith/stickydisk-delete cleanup.
      - name: Mount cargo registry (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Mount target dir (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-target-test
          path: ./target
      - uses: taiki-e/install-action@nextest
      # Canonical runner (ONE-1144): process-per-test isolation, full tier.
      - run: cargo nextest run --workspace --all-features --profile full
      # nextest does not run doctests; keep them covered separately.
      - run: cargo test --doc --workspace --exclude oneiron-bench --all-features

  package:
    name: Package oneiron-server
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Publish-integrity check (missing files in the shipped crate) — only
    # meaningful on main, not per-PR.
    if: github.event_name == 'push'
    permissions:
      contents: read
    env:
      LOCAL_ONEIRON_PATCH: 'patch.crates-io.oneiron.path="crates/oneiron"'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.96"
      # Sticky disks replace the previous rust-cache here too (each run was
      # paying a ~400MB actions-cache save/restore cycle). Runs on main
      # pushes only, so the fork guard is inert but kept for uniformity.
      - name: Mount cargo registry (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Mount target dir (sticky disk)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1.4.0
        with:
          key: ${{ github.repository }}-target-package
          path: ./target
      - run: rm -rf target/package/oneiron-server-*
      - run: cargo package -p oneiron-server --list --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: cargo package -p oneiron-server --no-metadata --config "${LOCAL_ONEIRON_PATCH}"
      - run: |
          package_manifest="$(find target/package -mindepth 2 -maxdepth 2 -path 'target/package/oneiron-server-*/Cargo.toml' -print -quit)"
          test -n "${package_manifest}"
          cargo test --manifest-path "${package_manifest}" --all-features --config "${LOCAL_ONEIRON_PATCH}"

  deny:
    name: cargo-deny
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    name: typos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.45.1
