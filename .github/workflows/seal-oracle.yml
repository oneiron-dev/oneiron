name: Seal Oracle

# ONE-1837 §9 as rewritten by amendment A6 (card crypto:ops, ratified
# 2026-07-29) and amended again 2026-08-24: the differential oracle is
# event-based only, and the event is a merge to main that touches the seal
# crate (or this file). Manual dispatch stays, for a run on demand.
#
# The `v*` release-tag trigger A6 called for was REMOVED by the 2026-08-24
# amendment: a tag adds no seal-crate content that the main merge behind it
# did not already run, so it only bought a duplicate run. It NEVER runs on
# pull_request and NEVER on a schedule: if nothing changed, nothing fires.
#
# This leg runs ONLY the pyHanko/pdfsig differential oracle; no EU-DSS
# validation is claimed or performed here.
#
# Host (2026-09-08, HYG-06b): the self-hosted macOS runners. The
# digest-pinned python:3.12 container of the cloud era cannot run there
# (a `container:` job needs a Linux Docker host), so the §9 pins moved into
# the job itself: uv 0.12.1 in a job-local venv, CPython 3.12 resolved by
# uv, pyhanko 0.35.2 from the committed uv.lock. pdfsig (poppler) is part
# of the runner host contract (AGENTS.md "Self-hosted runners").
on:
  push:
    branches: [main]
    paths:
      - 'crates/oneiron-seal/**'
      - '.github/workflows/seal-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No RUSTFLAGS, as in ci.yml: the vendored heed path dependency is not
  # lint-capped, and unset flags share the runner cache with dev builds.

concurrency:
  group: seal-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle:
    name: Differential oracle (pyHanko + pdfsig)
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 60
    if: vars.CI_PAUSED != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Host tools (pdfsig from poppler, python3 for the uv bootstrap)
        run: |
          pdfsig -v
          python3 --version
      - name: Toolchain (host rustup, pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          cargo --version
      # pyHanko is a CI oracle only (A6): installed from the committed
      # uv.lock pin (pyhanko == 0.35.2), never shipped or referenced at
      # runtime. uv itself is version-pinned inside a throwaway venv under
      # the runner's temp dir; `uv sync --locked` enforces the content pins
      # below it and `--python 3.12` keeps the interpreter major.minor the
      # container used to pin.
      - name: Install pinned pyHanko oracle
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --disable-pip-version-check "uv==0.12.1"
          "$RUNNER_TEMP/uv/bin/uv" sync --locked --python 3.12 --project crates/oneiron-seal/oracle
          echo "$(pwd)/crates/oneiron-seal/oracle/.venv/bin" >> "$GITHUB_PATH"
      # Oracle matrix rows 2 (native seal -> pyHanko validate) and 4
      # (native seal -> pdfsig validate) plus rows 1/3 coverage of the
      # native paths. Nothing else runs on this leg.
      - run: cargo test --locked -p oneiron-seal --features seal-oracle --test oracle
