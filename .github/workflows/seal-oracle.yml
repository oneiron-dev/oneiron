name: Seal Oracle

# ONE-1837 §9 as rewritten by amendment A6 (card crypto:ops, ratified
# 2026-07-29): the differential oracle is event-based only. It fires on
# merges to main that touch the seal crate, on v* release tags (the EU-DSS
# row rides the tags), and on manual dispatch while the lane is built. It
# NEVER runs on pull_request and NEVER on a schedule: if nothing changed,
# nothing fires.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/oneiron-seal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seal-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle:
    name: Differential oracle (pyHanko + pdfsig)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hermetic image pinned by digest (§9 posture): CPython for the pinned
    # pyHanko oracle; the Rust toolchain, poppler (pdfsig), and uv are
    # provisioned on top.
    container:
      image: python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
    steps:
      - name: Install system tooling (pdfsig, linker, curl)
        run: apt-get update && apt-get install -y --no-install-recommends curl gcc poppler-utils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
      # pyHanko is a CI oracle only (A6): installed from the committed
      # uv.lock pin (pyhanko == 0.35.2), never shipped or referenced at
      # runtime.
      - name: Install pinned pyHanko oracle
        run: |
          pip install uv
          uv sync --locked --project crates/oneiron-seal/oracle
          echo "$(pwd)/crates/oneiron-seal/oracle/.venv/bin" >> "$GITHUB_PATH"
      # Oracle matrix rows 2 (native seal -> pyHanko validate) and 4
      # (native seal -> pdfsig validate) plus rows 1/3 coverage of the
      # native paths. The tag trigger is the designated carrier for the
      # EU-DSS row (A6).
      - run: cargo test -p oneiron-seal --features seal-oracle --test oracle
