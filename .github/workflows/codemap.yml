name: Codemap

# MAIN ONLY, and the map's only writer (owner ruling 2026-09-27). The code map
# (docs/CODEMAP.md, docs/codemap/) stays committed, but only this job writes it:
# after every push to main it regenerates the map and commits the result
# straight to main. PRs never touch the map and PR CI never checks it, so
# parallel PRs stop conflicting on generated files.
#
# Not gated on CI_PAUSED: this job is a writer, not a check. It runs on a
# GitHub-hosted runner (free for this public repo) because actions/setup-python
# cannot install on our self-hosted runners (see wire-quickstart.yml), and a
# one-minute job should not queue behind the self-hosted test lanes.
#
# The push uses CODEMAP_TOKEN, a fine-grained token of a repository admin with
# Contents: read and write on this repo only (the main ruleset lets admins
# bypass its pull-request rule; deploy keys are disabled for this repo and
# GITHUB_TOKEN cannot bypass a ruleset). Without the secret the job only reports.
# The commit carries [skip ci], so the regenerate commit starts no other
# workflow, and the trigger paths exclude the map itself, so it never re-triggers.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'scripts/codemap/**'
      - '.github/workflows/codemap.yml'
  workflow_dispatch:

permissions:
  contents: write

# One writer at a time. A queued run regenerates from the newest main, not from
# the sha that queued it, so a skipped intermediate push loses nothing.
concurrency:
  group: codemap
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate code map
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEMAP_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and push to main
        env:
          HAS_TOKEN: ${{ secrets.CODEMAP_TOKEN != '' }}
        run: |
          git config user.name oneiron-codemap
          git config user.email codemap@oneiron.dev
          for attempt in 1 2 3; do
            # Start from the newest main every time. A rejected push means main
            # moved, so the map is rebuilt for the new tip instead of rebasing
            # generated files onto it.
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/codemap/codemap.py
            if [ -z "$(git status --porcelain docs/CODEMAP.md docs/codemap)" ]; then
              echo "Code map already current at $(git rev-parse --short HEAD)"
              exit 0
            fi
            git add -A docs/CODEMAP.md docs/codemap
            git commit -q -m "codemap: regenerate [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed $(git rev-parse --short HEAD) on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; regenerating on the new main"
          done
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "CODEMAP-NO-TOKEN: the map on main is stale; add the CODEMAP_TOKEN secret (fine-grained token, Contents read/write, this repo) and re-run"
            exit 0
          fi
          echo "CODEMAP-PUSH-FAILED: main refused the push 3 times with a token present"
          exit 1
