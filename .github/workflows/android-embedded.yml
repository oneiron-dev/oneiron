name: Android embedded
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # The engine-feature graphs (OF-237) reach the UniFFI binding, the shared
    # SDK, the server and its host contract, so those paths run the compile
    # job too.
    paths:
      - 'crates/oneiron-android/**'
      - 'crates/oneiron-uniffi/**'
      - 'crates/oneiron-remote/**'
      - 'crates/oneiron-server/**'
      - 'crates/oneiron-vault-contract/**'
      - 'Cargo.lock'
      - '.github/workflows/android-embedded.yml'
  workflow_dispatch:
  # Engine and build-file changes are covered nightly (owner 2026-09-26: scoped CI).
  schedule:
    - cron: '45 18 * * *'
env:
  CARGO_TERM_COLOR: always
concurrency:
  group: android-embedded-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    # A fork PR runs on GitHub's ephemeral macos-latest instead: PR code never
    # reaches a persistent self-hosted runner from outside the repo (F32).
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["macos-latest"]' || '["self-hosted","macos","arm64"]') }}
    timeout-minutes: 45
    if: vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enforce runner cache budget
        run: scripts/ci/cap-target-cache.sh
      - name: Android aarch64 toolchain
        run: |
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build the shared core with NDK (aarch64 includes NEON)
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo build --locked -p oneiron-android --target aarch64-linux-android --release
          mkdir -p crates/oneiron-android/kotlin/src/main/jniLibs/arm64-v8a
          cp "${CARGO_TARGET_DIR:-target}/aarch64-linux-android/release/liboneiron_android.so" crates/oneiron-android/kotlin/src/main/jniLibs/arm64-v8a/
      - name: Kotlin JNI vault round trip on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          script: gradle -p crates/oneiron-android/kotlin connectedCheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-embedded-test-results
          path: crates/oneiron-android/kotlin/build/reports/androidTests
  engine-compile:
    # OF-237: compile-only evidence that the default-off `engine` graphs build
    # for the phone target, one package per invocation so neither feature
    # selector is ambiguous. `cargo check --lib` only: nothing is linked,
    # packaged or run, and there is no test stage.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["macos-latest"]' || '["self-hosted","macos","arm64"]') }}
    timeout-minutes: 60
    if: vars.CI_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enforce runner cache budget
        run: scripts/ci/cap-target-cache.sh
      - name: Android aarch64 toolchain
        run: |
          sdkmanager 'ndk;27.2.12479018'
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Check the engine graphs for aarch64-linux-android
        run: |
          # The NDK ships its LLVM prebuilt per build host.
          case "$(uname -s)" in
            Linux) NDK_HOST=linux-x86_64 ;;
            Darwin) NDK_HOST=darwin-x86_64 ;;
            *) echo "no Android NDK prebuilt for $(uname -s)"; exit 1 ;;
          esac
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$NDK_HOST/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo check --locked --lib -p oneiron-android --features engine --target aarch64-linux-android
          cargo check --locked --lib -p oneiron-uniffi --features engine --target aarch64-linux-android
