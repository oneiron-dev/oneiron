[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/oneiron-dev/oneiron"
homepage = "https://github.com/oneiron-dev/oneiron"
readme = "README.md"
keywords = ["retrieval", "vector-search", "lmdb", "crdt"]
categories = ["database", "command-line-utilities"]

[workspace.dependencies]
arc-swap = "1.9"
heed = "0.20"
uuid = { version = "1", features = ["v7"] }
# ONE-1140 (OD-1): receipt origin attestation, pinned to the 2.2.x line.
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
# OsRng for device-key minting (ed25519-dalek's rand_core line is 0.6).
rand_core = { version = "0.6.4", features = ["getrandom"] }
thiserror = "2"
rmp-serde = "1"
rmpv = "1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh32"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
postcard = "1.1"
blake3 = "1"
futures-core = "0.3"
p256 = { version = "0.13", features = ["ecdsa"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
single_use_lifetimes = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
redundant_clone = "deny"
semicolon_if_nothing_returned = "deny"
unnecessary_wraps = "deny"
inefficient_to_string = "deny"
unnecessary_sort_by = "deny"
manual_contains = "deny"
field_reassign_with_default = "deny"
unnecessary_literal_unwrap = "deny"
redundant_closure_for_method_calls = "deny"
explicit_iter_loop = "deny"
uninlined_format_args = "deny"
map_unwrap_or = "deny"
needless_collect = "deny"
items_after_statements = "deny"
unwrap_used = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
