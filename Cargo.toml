[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/oneiron-dev/oneiron"
homepage = "https://github.com/oneiron-dev/oneiron"
readme = "README.md"
keywords = ["retrieval", "vector-search", "lmdb", "crdt"]
categories = ["database", "command-line-utilities"]

[workspace.dependencies]
heed = "0.20"
uuid = { version = "1", features = ["v7"] }
# ONE-1140 (OD-1): receipt origin attestation, pinned to the 2.2.x line.
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
# OsRng for device-key minting (ed25519-dalek's rand_core line is 0.6).
rand_core = { version = "0.6.4", features = ["getrandom"] }
thiserror = "2"
rmp-serde = "1"
rmpv = "1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh32"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toon-format = { version = "0.4", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
