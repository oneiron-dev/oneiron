[files]
extend-exclude = [
    "docs/**/*.svg",
    # Pinned upstream vendor of heed 0.20.5 — never edited here (crates/heed/PROVENANCE.md).
    "crates/heed/vendor/**",
    # Pinned upstream vendor of paste 1.0.15 — never edited here (crates/paste/PROVENANCE.md).
    "crates/paste/vendor/**",
    # Generated from source by scripts/codemap/codemap.py — fix the source, not the map.
    "docs/codemap/**",
    "target/**",
    "**/*.lock",
    # Frozen excerpt of the spec corpus, used as embedder measurement input. Not
    # prose this repo authors, and editing it would invalidate the reference
    # vectors committed beside it.
    "crates/oneiron-server/tests/fixtures/embed/**",
]

[default.extend-words]
anc = "anc"
ba = "ba"
Caf = "Caf"
caf = "caf"
# Truncated lookalike fixture in campaign/claims/tests.rs — must NOT equal `do_not_contact`.
contac = "contac"
Flate = "Flate"
flate = "flate"
# From the coined compound "edge-ful" (an op that writes identity edges); typos splits the hyphen.
ful = "ful"
mis = "mis"
# Short-id prefix fixture ("pn", "pn1") in maintain/tests.rs and a parameter name in split_check.py.
pn = "pn"
# Engine consent term (DEC-0006): a "non-rememberable" class can never back a standing grant.
rememberable = "rememberable"
SINIC = "SINIC"
unparseable = "unparseable"

[default.extend-identifiers]
# candle's own API names, reached verbatim: `Tensor::arange` and
# `VarBuilder::from_mmaped_safetensors`.
arange = "arange"
from_mmaped_safetensors = "from_mmaped_safetensors"
# Prose plural of the CODE_SYMBOL entity type; typos splits `…SYMBOLs` into `SYMBO` + `Ls`.
CODE_SYMBOLs = "CODE_SYMBOLs"
# Deliberately invalid relationship label in federation/tests.rs (digit inside the word).
fri3nd = "fri3nd"
# "literals" — local and return name in scripts/refactor/tools/split_check.py.
lits = "lits"
# Prose plural of the MESSAGE entity type; typos splits `MESSAGEs` into `MESSAG` + `Es`.
MESSAGEs = "MESSAGEs"
# The O(ND) name of Myers' diff algorithm in edit_distance/myers.rs.
ND = "ND"
# Prose plural of the REQUEST record type; typos splits `REQUESTs` into `REQUES` + `Ts`.
REQUESTs = "REQUESTs"
# PDF 1.7 spec dictionary key `DecodeParms` (byte string in blob_artifact/esign/render/streams.rs).
DecodeParms = "DecodeParms"
# ext4 filesystem creator tool `mke2fs`, invoked by scripts/microvm/build.py and named in its docs/tests. CI: https://github.com/oneiron-dev/oneiron/actions/runs/35562251441/job/106217236544
mke2fs = "mke2fs"

# The exact gold filename is unique to crates/oneiron/src/data/.
# Root-walk discovery does not read nested configs; type globs match basenames.
# Frozen gold names/acronyms are evidence, not spelling fixes.
[type.of360-gold]
extend-glob = ["of360_gold.v1.json"]

[type.of360-gold.extend-identifiers]
FLE = "FLE" # French as a foreign language support in the exchange-student case.
Hav = "Hav" # Employer name in the ferry-commuter case.
Ines = "Ines" # Given name in the pastry and trail-running cases.
ND5 = "ND5" # Neutral-density solar filter; do not allow the split word globally.
NWO = "NWO" # Dutch research funding panel in the thesis case.
Stads = "Stads" # Clinic name in the health case.
