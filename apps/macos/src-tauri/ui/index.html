<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oneiron Recorder</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <h1 id="app-name"></h1>

      <section id="disclosure" class="panel">
        <h2 id="disclosure-title"></h2>
        <p id="disclosure-body"></p>
        <p id="disclosure-affirm" class="affirm"></p>
        <button id="affirm-button" type="button"></button>
      </section>

      <section class="panel">
        <p id="state" class="state"></p>
        <p id="hint"></p>
        <div class="actions">
          <button id="start-button" type="button"></button>
          <button id="stop-button" type="button"></button>
        </div>
        <p id="error" class="error" hidden></p>
      </section>

      <section class="panel">
        <h2>Segments</h2>
        <p id="segments-empty"></p>
        <ul id="segments"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
