# cargo-nextest configuration (ONE-1144).
#
# nextest is the canonical test runner: process-per-test isolation removes
# the shared-process LMDB flake class (cumulative pthread-key pressure,
# shared-env state). It does NOT fix the macOS SysV-semaphore EINVAL(22)
# collision class — the semaphore namespace is system-wide (ONE-1148).
#
# Tiers:
#   * default (fast): `cargo nextest run -p oneiron [--features sync,test-hooks]`
#     — excludes the `slow` set below; the dev/agent inner loop.
#   * full: `cargo nextest run -p oneiron --profile full [--features sync,test-hooks]`
#     — everything; the pre-push gate and CI.
#
# `#[ignore]`d tests stay ignored in both tiers (nextest default; never add
# run-ignored here — the remaining ignored test is parked on ONE-1141).

[profile.default]
# Fast/dev/agent inner loop: no retries — nextest's built-in `retries = 0`,
# so the loop fails fast. Do NOT re-add retries here "for symmetry"; retries
# live on the `full`/CI profile only (ONE-1144 owner decision).
# Slow tier (exclusion set). Boundary proposed under ONE-1144, pending
# ratification:
#   * vault_open_drop_cycles_survive_pthread_key_limit
#     — 600 sequential Vault open/drop cycles (ONE-1142 regression guard)
#   * hnsw_recall_at_10_vs_bruteforce
#     — 1k-vector recall benchmark against brute force
#   * the `sync_convergence_props` module inside the `it_sync` binary
#     — the whole ONE-1136 two-vault CRDT convergence property suite
#       (multi-round Loro exchange per test; sync feature only)
# The two unit tests match by name substring (`~`), not exact `=` path, so
# a future split of the flat `tests` module cannot silently un-exclude them;
# each name is unique workspace-wide.
default-filter = """
not (
  test(~vault_open_drop_cycles_survive_pthread_key_limit)
  | test(~hnsw_recall_at_10_vs_bruteforce)
  | (binary(=it_sync) & test(/^sync_convergence_props::/))
)
"""
# A stuck test fails instead of stalling the run: nextest kills it after
# period x terminate-after (each retry under `full`/`ci-pr` gets the same
# bound). Every profile inherits this and the override below. The slowest
# healthy tests took ~22 min on a loaded gate host.
slow-timeout = { period = "60s", terminate-after = 60 }

# The 10,001-record budget test held a gate for 38+ min before its setup
# stopped committing once per record. It still takes 170-240 s on mel, 400 s
# alone on sel and 1,271-1,319 s inside a full sel gate: each source turn
# syncs its own custody key, and each entity read during the wake decodes the
# whole persisted window. 60 min until those costs drop.
[[profile.default.overrides]]
filter = 'package(oneiron) & test(=conversation_dag::tests::replay::ready_parent_budget_continues_after_reopen_without_other_traffic)'
slow-timeout = { period = "60s", terminate-after = 60 }
priority = 100

# The other conversation_dag replay tests finish in seconds.
[[profile.default.overrides]]
filter = 'package(oneiron) & test(/^conversation_dag::tests::replay::/)'
slow-timeout = { period = "60s", terminate-after = 12 }

# Long tests start first, so none of them starts late and stretches the end of
# a run. Tests run lexicographically otherwise. Priority (higher runs sooner)
# and threads-required only order and weight the queue: every profile still
# runs the same tests with the same timeouts and retries. threads-required is
# the test's own worker count; the default is 1. Times are gate medians from
# 2026-10-10 to 10-16 (kel, bel, sel and gce logs).
#
# 200-500 s each.
[[profile.default.overrides]]
filter = """
  (package(oneiron) & test(=receipt::tests::gate_receipt_query_paginates_past_legacy_scan_window))
  | (package(oneiron) & test(=origin::lfs::chunk_tests::streamed_2_3_gb_generated_fixture_has_bounded_chunks))
  | (package(oneiron-server) & test(=livequery::production_tests::view_filters_before_top_k_past_one_thousand_unrelated_records))
  | (package(oneiron-bench) & test(=beam::tests_ppr_vad::tests::ppr_vad_sweep_public_run_command_loads_relative_fixture))
"""
priority = 100

# trybuild compiles each case with a child cargo, which runs several rustc jobs.
[[profile.default.overrides]]
filter = 'package(oneiron) & binary(=type_boundaries_compilefail)'
priority = 100
threads-required = 2

# A two-worker multi-thread Tokio runtime.
[[profile.default.overrides]]
filter = 'package(oneiron-server) & binary(=it) & test(=slip_clock::two_hundred_agents_minted_one_process_each_all_prove_on_the_next_serve)'
priority = 100
threads-required = 2

# 80-220 s each.
[[profile.default.overrides]]
filter = """
  (package(oneiron) & test(=skill_hub::refinement_custody::tests::over_100k_real_unrelated_carriers_cannot_strand_one_receipt_delete))
  | (package(oneiron-server) & test(=api::tests::mcp_code_check::shadow_mode_changes_no_programs_behaviour_or_result))
  | (package(oneiron-server) & test(=livequery::production_tests::settled_out_of_view_births_do_not_exhaust_lag_origin_retention))
"""
priority = 50

# The slow tier (see default-filter above), which runs under full and
# featureless.
[[profile.default.overrides]]
filter = """
  test(~vault_open_drop_cycles_survive_pthread_key_limit)
  | test(~hnsw_recall_at_10_vs_bruteforce)
  | (binary(=it_sync) & test(/^sync_convergence_props::/))
"""
priority = 20

[profile.full]
# Full tier: every test (slow set included). Used by CI and the pre-push
# gate. Sets retries = 2 explicitly (CI/pre-merge only); the fast/`default`
# tier uses nextest's built-in retries = 0 and fails fast on the inner loop.
retries = 2
default-filter = "all()"

[profile.ci-pr]
# PR-CI tier: the fast `default` filter (skips the slow set) BUT retries = 2,
# so a transient flake doesn't red a PR. `default` stays retries = 0 for the
# local fail-fast inner loop (ONE-1144). This is a legacy opt-in profile:
# .github/workflows/ci.yml uses `full` for PRs and main pushes. Do not switch
# those gates to this profile: it would drop their slow-test coverage.
retries = 2
default-filter = """
not (
  test(~vault_open_drop_cycles_survive_pthread_key_limit)
  | test(~hnsw_recall_at_10_vs_bruteforce)
  | (binary(=it_sync) & test(/^sync_convergence_props::/))
)
"""

# CI runs this full-filter, zero-retry process-per-test tier beside the
# mandatory shared-process featureless `cargo test --lib` step. The two
# process models complement each other; neither replaces the other.
[profile.featureless]
default-filter = "all()"
retries = 0
